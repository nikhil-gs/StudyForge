<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyForAll - AI Study Material Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
      color: #e7e9ea;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(29, 155, 240, 0.2);
    }

    .header h1 {
      font-size: 3rem;
      color: #fff;
      margin-bottom: 8px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .header p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.1rem;
    }

    .card {
      background: linear-gradient(135deg, #16181c 0%, #1a1f2e 100%);
      border: 1px solid #2f3336;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .card:hover {
      border-color: #1d9bf0;
      box-shadow: 0 8px 24px rgba(29, 155, 240, 0.15);
    }

    .api-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .api-select,
    .dropdown,
    .topic-input,
    .api-key-input {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #2f3336;
      background: #0f1419;
      color: #fff;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .api-select:focus,
    .dropdown:focus,
    .topic-input:focus,
    .api-key-input:focus {
      outline: none;
      border-color: #1d9bf0;
      box-shadow: 0 0 0 3px rgba(29, 155, 240, 0.1);
      background: #16181c;
    }

    .api-key-input {
      flex: 1;
      min-width: 200px;
    }

    .api-select {
      min-width: 160px;
      cursor: pointer;
    }

    .dropdown {
      flex: 1;
      min-width: 140px;
      cursor: pointer;
    }

    .topic-input {
      width: 100%;
      margin-bottom: 12px;
    }

    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .get-key-link {
      color: #fff;
      background: rgba(29, 155, 240, 0.2);
      border: 1px solid #1d9bf0;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      white-space: nowrap;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .get-key-link:hover {
      background: #1d9bf0;
      color: #fff;
      box-shadow: 0 4px 12px rgba(29, 155, 240, 0.3);
    }

    .type-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }

    .type-btn {
      padding: 12px 20px;
      border-radius: 24px;
      border: 2px solid #2f3336;
      background: #0f1419;
      color: #71767b;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .type-btn:hover {
      border-color: #1d9bf0;
      color: #1d9bf0;
      background: rgba(29, 155, 240, 0.05);
    }

    .type-btn.active {
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      color: #fff;
      border-color: #1d9bf0;
      box-shadow: 0 4px 12px rgba(29, 155, 240, 0.3);
    }

    .generate-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(29, 155, 240, 0.2);
    }

    .generate-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(29, 155, 240, 0.4);
    }

    .generate-btn:disabled {
      background: #2f3336;
      color: #71767b;
      cursor: not-allowed;
      box-shadow: none;
    }

    .hist-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .hist-tab {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #2f3336;
      background: #0f1419;
      color: #71767b;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.3s ease;
    }

    .hist-tab:hover {
      border-color: #1d9bf0;
      color: #1d9bf0;
      background: rgba(29, 155, 240, 0.05);
    }

    .hist-tab.active {
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      color: #fff;
      border-color: #1d9bf0;
      box-shadow: 0 4px 12px rgba(29, 155, 240, 0.2);
    }

    .out-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .action-btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid #1d9bf0;
      background: rgba(29, 155, 240, 0.1);
      color: #1d9bf0;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .action-btn:hover {
      background: #1d9bf0;
      color: #fff;
      box-shadow: 0 4px 12px rgba(29, 155, 240, 0.3);
    }

    .output-content {
      background: #0f1419;
      border: 1px solid #2f3336;
      border-radius: 12px;
      padding: 20px;
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      line-height: 1.8;
      color: #e7e9ea;
      max-height: 500px;
      overflow-y: auto;
      word-wrap: break-word;
    }

    /* Enhanced output formatting */
    .formatted-output {
      background: #0f1419;
      border: 1px solid #2f3336;
      border-radius: 12px;
      padding: 24px;
      max-height: 700px;
      overflow-y: auto;
    }

    .formatted-output h2 {
      color: #1d9bf0;
      font-size: 1.4rem;
      margin: 20px 0 16px 0;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(29, 155, 240, 0.3);
    }

    .formatted-output h3 {
      color: #71ebf5;
      font-size: 1.1rem;
      margin: 16px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .formatted-output h4 {
      color: #e7e9ea;
      font-size: 0.95rem;
      margin: 12px 0 8px 0;
      font-weight: 600;
    }

    .formatted-output p {
      margin: 8px 0;
      line-height: 1.7;
      color: #bab9b4;
    }

    .formatted-output li {
      margin: 6px 0 6px 20px;
      color: #bab9b4;
      line-height: 1.6;
    }

    .formatted-output ul, .formatted-output ol {
      margin: 10px 0;
    }

    .question-block {
      background: linear-gradient(135deg, rgba(29, 155, 240, 0.1) 0%, rgba(26, 140, 216, 0.05) 100%);
      border-left: 4px solid #1d9bf0;
      padding: 16px;
      margin: 12px 0;
      border-radius: 8px;
    }

    .question-block strong {
      color: #71ebf5;
    }

    .answer-block {
      background: rgba(67, 122, 34, 0.1);
      border-left: 4px solid #437a22;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      color: #bab9b4;
      font-size: 0.9rem;
    }

    .concept-box {
      background: linear-gradient(135deg, rgba(113, 235, 245, 0.1) 0%, rgba(29, 155, 240, 0.05) 100%);
      border: 1px solid rgba(113, 235, 245, 0.3);
      padding: 14px;
      margin: 10px 0;
      border-radius: 8px;
      border-left: 4px solid #71ebf5;
    }

    .formula-box {
      background: rgba(249, 24, 128, 0.08);
      border: 1px solid rgba(249, 24, 128, 0.2);
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      color: #ff9ab3;
      text-align: center;
    }

    .flashcard {
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      border-radius: 12px;
      padding: 20px;
      margin: 12px 0;
      color: #fff;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 4px 16px rgba(29, 155, 240, 0.2);
    }

    .flashcard.back {
      background: linear-gradient(135deg, rgba(113, 235, 245, 0.2) 0%, rgba(29, 155, 240, 0.1) 100%);
      color: #71ebf5;
      border: 1px solid #71ebf5;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 0 12px 0;
      padding-bottom: 8px;
      border-bottom: 2px solid rgba(29, 155, 240, 0.3);
    }

    .section-icon {
      font-size: 1.3rem;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 250px;
      overflow-y: auto;
    }

    .hist-item {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #2f3336;
      background: linear-gradient(135deg, #16181c 0%, #1a1f2e 100%);
      color: #e7e9ea;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }

    .hist-item:hover {
      border-color: #1d9bf0;
      background: linear-gradient(135deg, rgba(29, 155, 240, 0.1) 0%, rgba(29, 155, 240, 0.05) 100%);
      transform: translateX(4px);
    }

    .hist-item .del-btn {
      color: #f91880;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      transition: all 0.3s ease;
    }

    .hist-item .del-btn:hover {
      color: #ff4d4d;
      transform: scale(1.2);
    }

    .history-tabs {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .tab-label {
      color: #71767b;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .loader {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 20, 25, 0.95);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #2f3336;
      border-top-color: #1d9bf0;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 20px rgba(29, 155, 240, 0.3);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader p {
      margin-top: 20px;
      color: #71767b;
      font-size: 1.1rem;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      color: #fff;
      padding: 14px 28px;
      border-radius: 10px;
      opacity: 0;
      transition: opacity 0.3s;
      font-size: 0.9rem;
      z-index: 1001;
      box-shadow: 0 4px 16px rgba(29, 155, 240, 0.3);
      font-weight: 500;
    }

    .toast.show {
      opacity: 1;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0f1419;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: #2f3336;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #1d9bf0;
    }

    .card h3 {
      color: #71ebf5;
      font-size: 1.2rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── MCQ Interactive Styles ── */
    .mcq-option {
      background: rgba(47, 51, 54, 0.3);
      border: 2px solid #2f3336;
      padding: 12px 14px;
      margin: 8px 0;
      border-radius: 8px;
      color: #bab9b4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s ease;
      user-select: none;
    }

    .mcq-option:hover:not(.mcq-answered) {
      border-color: #1d9bf0;
      background: rgba(29, 155, 240, 0.08);
      color: #e7e9ea;
    }

    .mcq-option.mcq-correct {
      background: rgba(34, 197, 94, 0.15);
      border-color: #22c55e;
      color: #a8e6a1;
    }

    .mcq-option.mcq-wrong {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #fca5a5;
    }

    .mcq-option.mcq-reveal-correct {
      background: rgba(34, 197, 94, 0.1);
      border-color: rgba(34, 197, 94, 0.5);
      color: #a8e6a1;
    }

    .mcq-option.mcq-answered {
      cursor: default;
    }

    .mcq-feedback {
      display: none;
      padding: 10px 14px;
      border-radius: 6px;
      margin: 10px 0 0 0;
      font-size: 0.9rem;
      animation: fadeIn 0.3s ease;
    }

    .mcq-feedback.show {
      display: block;
    }

    .mcq-feedback.correct {
      background: rgba(34, 197, 94, 0.1);
      border-left: 4px solid #22c55e;
      color: #a8e6a1;
    }

    .mcq-feedback.wrong {
      background: rgba(239, 68, 68, 0.1);
      border-left: 4px solid #ef4444;
      color: #fca5a5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Difficulty Badge Styles ── */
    .difficulty-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .difficulty-badge.easy {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .difficulty-badge.medium {
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .difficulty-badge.hard {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* ── Grading Panel Styles ── */
    .grade-panel {
      background: linear-gradient(135deg, rgba(29, 155, 240, 0.08) 0%, rgba(113, 235, 245, 0.04) 100%);
      border: 2px solid #1d9bf0;
      border-radius: 16px;
      padding: 24px;
      margin-top: 24px;
      text-align: center;
    }

    .grade-panel h2 {
      color: #1d9bf0;
      font-size: 1.4rem;
      margin-bottom: 16px;
    }

    .grade-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      font-weight: 700;
      font-size: 2rem;
      border: 6px solid;
    }

    .grade-circle .grade-label {
      font-size: 0.8rem;
      font-weight: 400;
      opacity: 0.8;
      margin-top: 2px;
    }

    .grade-stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .grade-stat {
      text-align: center;
    }

    .grade-stat .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .grade-stat .stat-label {
      font-size: 0.8rem;
      color: #71767b;
      margin-top: 4px;
    }

    .grade-breakdown {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .grade-breakdown-item {
      background: rgba(47, 51, 54, 0.4);
      border-radius: 10px;
      padding: 12px 18px;
      min-width: 100px;
    }

    .grade-breakdown-item .bd-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .grade-breakdown-item .bd-value {
      font-size: 1.1rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>StudyForAll</h1>
    <p>AI-Powered Study Material Generator</p>
  </div>

  <div class="card api-card">
    <div class="api-row">
      <select id="apiProvider" class="api-select">
        <option value="groq">Groq (Free)</option>
        <option value="gemini">Gemini (Google)</option>
        <option value="openai">OpenAI</option>
      </select>
      <input type="password" id="apiKey" class="api-key-input" placeholder="Paste your API key">
      <a href="javascript:void(0)" class="get-key-link" onclick="showProviderLink()">Get key here</a>
    </div>
  </div>

  <div class="card form-card">
    <div class="form-row">
      <input type="text" id="topic" class="topic-input" placeholder="Enter topic (e.g., Photosynthesis)">
    </div>
    <div class="form-row">
      <select id="subject" class="dropdown">
        <option value="Science">Science</option>
        <option value="Maths">Maths</option>
        <option value="History">History</option>
        <option value="English">English</option>
        <option value="Physics">Physics</option>
        <option value="Chemistry">Chemistry</option>
        <option value="Biology">Biology</option>
        <option value="Geography">Geography</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Economics">Economics</option>
      </select>
      <select id="grade" class="dropdown">
        <option value="6">Grade 6</option>
        <option value="7">Grade 7</option>
        <option value="8">Grade 8</option>
        <option value="9">Grade 9</option>
        <option value="10">Grade 10</option>
        <option value="11">Grade 11</option>
        <option value="12">Grade 12</option>
        <option value="UG">Undergraduate</option>
      </select>
    </div>
  </div>

  <div class="card types-card">
    <h3>Content Type</h3>
    <div class="type-btns">
      <button class="type-btn active" data-type="notes" onclick="setType('notes')">Study Notes</button>
      <button class="type-btn" data-type="mcq" onclick="setType('mcq')">MCQs</button>
      <button class="type-btn" data-type="practice" onclick="setType('practice')">Practice</button>
      <button class="type-btn" data-type="flashcards" onclick="setType('flashcards')">Flashcards</button>
      <button class="type-btn" data-type="summary" onclick="setType('summary')">Summary</button>
      <button class="type-btn" data-type="mindmap" onclick="setType('mindmap')">Mind Map</button>
    </div>
    <button class="generate-btn" onclick="generate()">Generate Material</button>
  </div>

  <div class="card" id="historyCard" style="display:none">
    <h3>History</h3>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="card result-card" id="resultCard" style="display:none">
    <div class="history-tabs">
      <span class="tab-label">📋 Your Generations:</span>
      <div class="hist-tabs" id="histTabs"></div>
    </div>
    <div class="out-actions">
      <button class="action-btn" onclick="copyOutput()">📋 Copy</button>
      <button class="action-btn" onclick="downloadOutput()">⬇️ Download</button>
    </div>
    <div id="formattedOutput"></div>
    <pre class="output-content" id="outputContent" style="display:none;"></pre>
  </div>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <p>Generating material...</p>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var contentType = 'notes';
    var historyData = [];
    var currentHistIdx = 0;

    // ── MCQ / Practice grading state ──
    var mcqState = { total: 0, correct: 0, answered: 0, easyCorrect: 0, easyTotal: 0, medCorrect: 0, medTotal: 0, hardCorrect: 0, hardTotal: 0 };
    var practiceState = { total: 0, revealed: 0, easyTotal: 0, medTotal: 0, hardTotal: 0 };

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() {
        t.classList.remove('show');
      }, 2500);
    }

    function showProviderLink() {
      var p = document.getElementById('apiProvider').value;
      var links = {
        groq: 'https://console.groq.com/keys',
        gemini: 'https://aistudio.google.com/app/apikey',
        openai: 'https://platform.openai.com/api-keys'
      };
      window.open(links[p], '_blank');
    }

    function setType(t) {
      contentType = t;
      var btns = document.querySelectorAll('.type-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('active');
      }
      document.querySelector('[data-type="' + t + '"]').classList.add('active');
    }

    function getPrompt(type, topic, subject, grade) {
      var gradeLabel = grade === 'UG' ? 'Undergraduate' : 'Grade ' + grade;
      var detailLevel = grade === 'UG' ? 'comprehensive university-level' : 'detailed';
      var syllabusNote = grade === 'UG' ? 'Cover all major concepts from standard university curriculum.' : 'Cover all major concepts from the syllabus.';

      var prompts = {
        notes: 'Create ' + detailLevel + ' study notes for ' + gradeLabel + ' ' + subject + ' on "' + topic + '". ' + syllabusNote + ' Structure: 1) Introduction & Definition, 2) Historical Context, 3) Key Concepts (with detailed explanations), 4) Detailed Explanation (with examples), 5) Important Formulas/Rules/Laws, 6) Applications & Real-world Examples, 7) Common Misconceptions & Mistakes, 8) Advanced Topics (if applicable), 9) Summary Box. Make it comprehensive with clear formatting using headers and sub-headers. Provide thorough, in-depth content for each section with multiple examples and explanations.',

        mcq: 'Generate exactly 15 MCQs for ' + gradeLabel + ' ' + subject + ' on "' + topic + '". Organize them into three difficulty sections. Format EXACTLY like this:\n\n## Easy\n\nQ1. [Question]\nA) [Option]\nB) [Option]\nC) [Option]\nD) [Option]\nAnswer: [Letter]\nExplanation: [Brief explanation]\n\nQ2. [Question]\nA) [Option]\nB) [Option]\nC) [Option]\nD) [Option]\nAnswer: [Letter]\nExplanation: [Brief explanation]\n\n(continue Q3, Q4, Q5)\n\n## Medium\n\nQ6. [Question]\nA) [Option]\nB) [Option]\nC) [Option]\nD) [Option]\nAnswer: [Letter]\nExplanation: [Brief explanation]\n\n(continue Q7-Q10)\n\n## Hard\n\nQ11. [Question]\nA) [Option]\nB) [Option]\nC) [Option]\nD) [Option]\nAnswer: [Letter]\nExplanation: [Brief explanation]\n\n(continue Q12-Q15)\n\nProvide exactly 5 Easy, 5 Medium, and 5 Hard questions. Each question must have 4 options (A-D), one correct Answer letter, and an Explanation. Make sure the questions genuinely increase in difficulty.',

        practice: 'Create exactly 15 practice questions with full solutions for ' + gradeLabel + ' ' + subject + ' on "' + topic + '". Organize them into three difficulty sections. Format EXACTLY like this:\n\n## Easy\n\nQ1. [Full question text]\n\nSolution:\n[Detailed step-by-step solution with clear working]\n\nQ2. [Full question text]\n\nSolution:\n[Detailed step-by-step solution]\n\n(continue Q3, Q4, Q5)\n\n## Medium\n\nQ6. [Full question text]\n\nSolution:\n[Detailed step-by-step solution]\n\n(continue Q7-Q10)\n\n## Hard\n\nQ11. [Full question text]\n\nSolution:\n[Detailed step-by-step solution]\n\n(continue Q12-Q15)\n\nProvide exactly 5 Easy, 5 Medium, and 5 Hard fully solved questions. Show complete step-by-step working for every solution. Each question should test different aspects of the topic.',

        flashcards: 'Create exactly 15 flashcards for ' + gradeLabel + ' ' + subject + ' on "' + topic + '". Format EACH card on separate lines like this:\nFront: [Question]\nBack: [Answer]\n\nRepeat this format for all 15 cards. Do not mix questions together.',

        summary: 'Create a detailed revision summary for ' + gradeLabel + ' ' + subject + ' on "' + topic + '". Include: Must-Know Concepts, Quick Facts, Common Exam Questions, Mnemonics, Key Formulas. Provide thorough and comprehensive content for each section with multiple items and examples.',

        mindmap: 'Create a structured mind map for "' + topic + '" suitable for ' + gradeLabel + ' ' + subject + '. Format exactly like:\n\n' + topic + '\n  - Main Branch 1\n    - Sub-topic 1.1\n      - Point 1.1.1\n      - Point 1.1.2\n    - Sub-topic 1.2\n      - Point 1.2.1\n  - Main Branch 2\n    - Sub-topic 2.1\n      - Point 2.1.1\n\nUse consistent indentation with 2 spaces per level. Each branch should have 2-3 sub-topics with 2-3 points each.'
      };
      return prompts[type];
    }

    async function callAPI(provider, key, prompt, retryCount) {
      retryCount = retryCount || 0;
      var maxRetries = 2;

      try {
        if (provider === 'groq') {
          var res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + key
            },
            body: JSON.stringify({
              model: 'llama-3.1-8b-instant',
              messages: [{
                role: 'user',
                content: prompt
              }],
              max_tokens: 4096
            })
          });
          var data = await res.json();
          if (!res.ok) {
            // Rate limit — auto-retry after delay
            if (res.status === 429 && retryCount < maxRetries) {
              var waitSec = (retryCount + 1) * 15;
              updateLoaderMsg('⏳ Rate limited — retrying in ' + waitSec + 's...');
              await sleep(waitSec * 1000);
              return callAPI(provider, key, prompt, retryCount + 1);
            }
            throw new Error(data.error ? data.error.message : 'Groq API error (HTTP ' + res.status + ')');
          }
          return data.choices[0].message.content;
        } else if (provider === 'gemini') {
          var res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + key, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: prompt
                }]
              }],
              generationConfig: {
                maxOutputTokens: 8192
              }
            })
          });
          var data = await res.json();
          if (!res.ok) {
            if (res.status === 429 && retryCount < maxRetries) {
              var waitSec = (retryCount + 1) * 15;
              updateLoaderMsg('⏳ Rate limited — retrying in ' + waitSec + 's...');
              await sleep(waitSec * 1000);
              return callAPI(provider, key, prompt, retryCount + 1);
            }
            throw new Error(data.error ? data.error.message : 'Gemini API error (HTTP ' + res.status + ')');
          }
          return data.candidates[0].content.parts[0].text;
        } else if (provider === 'openai') {
          var res = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + key
            },
            body: JSON.stringify({
              model: 'gpt-3.5-turbo',
              messages: [{
                role: 'user',
                content: prompt
              }],
              max_tokens: 8192
            })
          });
          var data = await res.json();
          if (!res.ok) {
            if (res.status === 429 && retryCount < maxRetries) {
              var waitSec = (retryCount + 1) * 15;
              updateLoaderMsg('⏳ Rate limited — retrying in ' + waitSec + 's...');
              await sleep(waitSec * 1000);
              return callAPI(provider, key, prompt, retryCount + 1);
            }
            throw new Error(data.error ? data.error.message : 'OpenAI API error (HTTP ' + res.status + ')');
          }
          return data.choices[0].message.content;
        }
      } catch (err) {
        if (err.message && err.message.indexOf('Failed to fetch') !== -1) {
          throw new Error('Network error — check your internet connection and try again.');
        }
        throw err;
      }
    }

    function sleep(ms) {
      return new Promise(function(resolve) { setTimeout(resolve, ms); });
    }

    function updateLoaderMsg(msg) {
      var loaderP = document.querySelector('.loader p');
      if (loaderP) loaderP.textContent = msg;
    }

    function escapeHtml(text) {
      var map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    function parseMarkdown(text) {
      // Bold with **text**
      text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      // Bold with __text__
      text = text.replace(/__(.*?)__/g, '<strong>$1</strong>');
      // Italic with *text* (but not **)
      text = text.replace(/(?<!\*)\*([^\*]+)\*(?!\*)/g, '<em>$1</em>');
      // Italic with _text_ (but not __)
      text = text.replace(/(?<!_)_([^_]+)_(?!_)/g, '<em>$1</em>');
      // Code with `text`
      text = text.replace(/`([^`]+)`/g, '<code style="background: rgba(29, 155, 240, 0.2); padding: 2px 6px; border-radius: 4px; color: #71ebf5;">$1</code>');
      return text;
    }

    // ──────────────────────────────
    //  FORMAT: NOTES
    // ──────────────────────────────
    function formatNotes(content) {
      var formatted = '<div class="formatted-output">';
      var lines = content.split('\n');
      var inList = false;
      var sectionCount = 0;

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) {
          if (inList) {
            formatted += '</ul>';
            inList = false;
          }
          formatted += '<div style="height: 8px;"></div>';
          continue;
        }

        // Headings with #
        if (line.match(/^#{1,6}\s/)) {
          if (inList) {
            formatted += '</ul>';
            inList = false;
          }
          var level = line.match(/^#+/)[0].length;
          var text = line.replace(/^#+\s/, '').trim();
          text = parseMarkdown(text);
          formatted += '<h' + (level + 1) + ' style="color: #1d9bf0; margin: 20px 0 12px 0; border-bottom: 2px solid rgba(29, 155, 240, 0.3); padding-bottom: 8px;">' + text + '</h' + (level + 1) + '>';
        }
        // Main numbered sections like "1. Key Concepts"
        else if (line.match(/^[1-9]\.\s/) && !line.match(/^[1-9]\.\s+.*[-–•*]/)) {
          var isMainSection = line.match(/^[1-9]\.\s+(Introduction|Historical|Key Concepts|Detailed|Important|Applications|Common|Advanced|Summary|Additional)/i);

          if (isMainSection) {
            if (inList) {
              formatted += '</ul>';
              inList = false;
            }
            sectionCount++;
            var sectionText = line.replace(/^[1-9]\.\s/, '').trim();
            sectionText = parseMarkdown(sectionText);
            formatted += '<h3 style="color: #71ebf5; margin: 18px 0 12px 0; font-size: 1.1rem; display: flex; align-items: center; gap: 8px;"><span style="color: #1d9bf0; background: rgba(29, 155, 240, 0.2); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem;">' + line.match(/^[1-9]/)[0] + '</span>' + sectionText + '</h3>';
          } else {
            if (!inList) {
              formatted += '<ul style="margin: 10px 0 10px 20px; list-style: none;">';
              inList = true;
            }
            var itemText = line.replace(/^\d+\.\s/, '').trim();
            itemText = parseMarkdown(itemText);
            formatted += '<li style="margin: 8px 0; padding-left: 20px; position: relative; line-height: 1.7;"><span style="position: absolute; left: 0; color: #1d9bf0;">▸</span>' + itemText + '</li>';
          }
        }
        // Sub-items with dashes or bullets
        else if (line.match(/^[-–•*]\s/) || line.match(/^\s+[-–•*]\s/)) {
          if (!inList) {
            formatted += '<ul style="margin: 10px 0 10px 20px; list-style: none;">';
            inList = true;
          }
          var itemText = line.replace(/^\s*[-–•*]\s/, '').trim();
          itemText = parseMarkdown(itemText);
          formatted += '<li style="margin: 8px 0; padding-left: 20px; position: relative; line-height: 1.7;"><span style="position: absolute; left: 0; color: #1d9bf0;">▸</span>' + itemText + '</li>';
        }
        // Definition lines
        else if (line.match(/^[A-Z].*:/) || line.match(/^\*\*[^*]+\*\*:/)) {
          var defText = parseMarkdown(line);
          formatted += '<p style="margin: 10px 0; padding: 8px; background: rgba(113, 235, 245, 0.05); border-left: 3px solid #71ebf5; border-radius: 4px;">' + defText + '</p>';
        }
        else {
          if (inList) {
            formatted += '</ul>';
            inList = false;
          }
          var pText = parseMarkdown(line);
          formatted += '<p style="margin: 10px 0; line-height: 1.8; color: #bab9b4;">' + pText + '</p>';
        }
      }

      if (inList) {
        formatted += '</ul>';
      }
      formatted += '</div>';
      return formatted;
    }

    // ──────────────────────────────
    //  FORMAT: MCQ (Interactive)
    // ──────────────────────────────
    function formatMCQ(content) {
      // Reset state
      mcqState = { total: 0, correct: 0, answered: 0, easyCorrect: 0, easyTotal: 0, medCorrect: 0, medTotal: 0, hardCorrect: 0, hardTotal: 0 };

      var formatted = '<div class="formatted-output">';
      formatted += '<h2 style="color: #1d9bf0; margin: 0 0 20px 0; font-size: 1.4rem; border-bottom: 2px solid rgba(29, 155, 240, 0.3); padding-bottom: 10px;">📝 Multiple Choice Quiz — Select Your Answers</h2>';

      var lines = content.split('\n');
      var questions = [];
      var currentQ = null;
      var currentDifficulty = 'medium';

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;

        // Detect difficulty headers
        if (line.match(/^##?\s*Easy/i) || line.match(/^Easy\s*$/i) || line.match(/^\*\*Easy\*\*/i)) {
          currentDifficulty = 'easy';
          continue;
        }
        if (line.match(/^##?\s*Medium/i) || line.match(/^Medium\s*$/i) || line.match(/^\*\*Medium\*\*/i)) {
          currentDifficulty = 'medium';
          continue;
        }
        if (line.match(/^##?\s*Hard/i) || line.match(/^Hard\s*$/i) || line.match(/^\*\*Hard\*\*/i)) {
          currentDifficulty = 'hard';
          continue;
        }

        if (line.match(/^Q\d+\.|^Question\s+\d+/i)) {
          if (currentQ) questions.push(currentQ);
          currentQ = { q: line.replace(/^Q\d+\.\s?|^Question\s+\d+\.?\s?/i, ''), options: [], answer: '', explanation: '', difficulty: currentDifficulty };
        } else if (currentQ && line.match(/^[A-D]\)\s/)) {
          currentQ.options.push(line);
        } else if (currentQ && line.match(/^Answer:|^Correct:/i)) {
          currentQ.answer = line.replace(/^Answer:\s?|^Correct:\s?/i, '').trim();
        } else if (currentQ && line.match(/^Explanation:/i)) {
          currentQ.explanation = line.replace(/^Explanation:\s?/i, '').trim();
        }
      }
      if (currentQ) questions.push(currentQ);

      mcqState.total = questions.length;

      // Count per-difficulty totals
      questions.forEach(function(q) {
        if (q.difficulty === 'easy') mcqState.easyTotal++;
        else if (q.difficulty === 'medium') mcqState.medTotal++;
        else mcqState.hardTotal++;
      });

      var prevDifficulty = '';
      questions.forEach(function(qObj, idx) {
        // Render difficulty section header
        if (qObj.difficulty !== prevDifficulty) {
          prevDifficulty = qObj.difficulty;
          var diffLabel = qObj.difficulty.charAt(0).toUpperCase() + qObj.difficulty.slice(1);
          formatted += '<div style="text-align: center; margin: 24px 0 16px 0;"><span class="difficulty-badge ' + qObj.difficulty + '">' + diffLabel + '</span></div>';
        }
        formatted += buildInteractiveMCQ(qObj, idx);
      });

      // Grading container (hidden until all answered)
      formatted += '<div id="mcqGradePanel" class="grade-panel" style="display:none;"></div>';
      formatted += '</div>';
      return formatted;
    }

    function buildInteractiveMCQ(qObj, idx) {
      var qId = 'mcq_' + idx;
      var html = '<div id="' + qId + '_wrap" style="background: linear-gradient(135deg, rgba(29, 155, 240, 0.06) 0%, rgba(113, 235, 245, 0.03) 100%); border: 2px solid #2f3336; border-radius: 10px; padding: 16px; margin: 14px 0;">';
      html += '<p style="color: #1d9bf0; font-weight: 600; font-size: 1rem; margin-bottom: 14px;">Q' + (idx + 1) + '. ' + parseMarkdown(qObj.q) + '</p>';

      qObj.options.forEach(function(opt) {
        var letter = opt[0];
        var optText = opt.replace(/^[A-D]\)\s?/, '').trim();
        optText = parseMarkdown(optText);
        html += '<div class="mcq-option" id="' + qId + '_' + letter + '" data-qid="' + qId + '" data-letter="' + letter + '" data-answer="' + (qObj.answer ? qObj.answer.charAt(0).toUpperCase() : '') + '" data-difficulty="' + qObj.difficulty + '" onclick="handleMCQClick(this)">';
        html += '<div><span style="color: #1d9bf0; font-weight: 600; margin-right: 10px;">' + letter + ')</span><span>' + optText + '</span></div>';
        html += '<span class="mcq-icon" style="font-weight: bold; font-size: 1.1rem;"></span>';
        html += '</div>';
      });

      // Feedback area
      html += '<div class="mcq-feedback" id="' + qId + '_feedback"></div>';

      // Explanation (hidden until answered)
      if (qObj.explanation) {
        html += '<div id="' + qId + '_explanation" style="display:none; padding: 10px 14px; border-radius: 6px; margin: 10px 0; background: rgba(113, 235, 245, 0.08); border-left: 4px solid #71ebf5; color: #71ebf5; font-size: 0.9rem;">ℹ️ ' + parseMarkdown(qObj.explanation) + '</div>';
      }

      html += '</div>';
      return html;
    }

    window.handleMCQClick = function(el) {
      var qId = el.getAttribute('data-qid');
      var selectedLetter = el.getAttribute('data-letter');
      var correctLetter = el.getAttribute('data-answer');
      var difficulty = el.getAttribute('data-difficulty');

      // Prevent re-answering
      var allOpts = document.querySelectorAll('[data-qid="' + qId + '"]');
      if (allOpts[0].classList.contains('mcq-answered')) return;

      var isCorrect = selectedLetter === correctLetter;

      // Mark all options as answered
      allOpts.forEach(function(opt) {
        opt.classList.add('mcq-answered');
        var optLetter = opt.getAttribute('data-letter');
        if (optLetter === correctLetter) {
          opt.classList.add('mcq-correct');
          opt.querySelector('.mcq-icon').textContent = '✓';
        }
        if (optLetter === selectedLetter && !isCorrect) {
          opt.classList.add('mcq-wrong');
          opt.querySelector('.mcq-icon').textContent = '✗';
        }
        if (optLetter !== correctLetter && optLetter !== selectedLetter) {
          opt.style.opacity = '0.5';
        }
      });

      // Update state
      mcqState.answered++;
      if (isCorrect) {
        mcqState.correct++;
        if (difficulty === 'easy') mcqState.easyCorrect++;
        else if (difficulty === 'medium') mcqState.medCorrect++;
        else mcqState.hardCorrect++;
      }

      // Show feedback
      var feedback = document.getElementById(qId + '_feedback');
      feedback.classList.add('show');
      if (isCorrect) {
        feedback.classList.add('correct');
        feedback.innerHTML = '✓ Correct!';
      } else {
        feedback.classList.add('wrong');
        feedback.innerHTML = '✗ Wrong — the correct answer is <strong>' + correctLetter + '</strong>';
      }

      // Show explanation
      var expEl = document.getElementById(qId + '_explanation');
      if (expEl) expEl.style.display = 'block';

      // Highlight the question border
      var wrap = document.getElementById(qId + '_wrap');
      wrap.style.borderColor = isCorrect ? '#22c55e' : '#ef4444';

      // Check if all questions answered → show grade
      if (mcqState.answered === mcqState.total) {
        setTimeout(showMCQGrade, 600);
      }
    };

    function showMCQGrade() {
      var pct = Math.round((mcqState.correct / mcqState.total) * 100);
      var grade, gradeColor;
      if (pct >= 90) { grade = 'A+'; gradeColor = '#22c55e'; }
      else if (pct >= 80) { grade = 'A'; gradeColor = '#22c55e'; }
      else if (pct >= 70) { grade = 'B'; gradeColor = '#3b82f6'; }
      else if (pct >= 60) { grade = 'C'; gradeColor = '#fbbf24'; }
      else if (pct >= 50) { grade = 'D'; gradeColor = '#f97316'; }
      else { grade = 'F'; gradeColor = '#ef4444'; }

      var panel = document.getElementById('mcqGradePanel');
      panel.style.display = 'block';
      panel.innerHTML = '<h2>🎓 Your Score</h2>' +
        '<div class="grade-circle" style="border-color: ' + gradeColor + '; color: ' + gradeColor + '; background: ' + gradeColor + '15;">' +
          '<span>' + grade + '</span>' +
          '<span class="grade-label">' + pct + '%</span>' +
        '</div>' +
        '<div class="grade-stats">' +
          '<div class="grade-stat"><div class="stat-value" style="color: #22c55e;">' + mcqState.correct + '</div><div class="stat-label">Correct</div></div>' +
          '<div class="grade-stat"><div class="stat-value" style="color: #ef4444;">' + (mcqState.total - mcqState.correct) + '</div><div class="stat-label">Wrong</div></div>' +
          '<div class="grade-stat"><div class="stat-value" style="color: #1d9bf0;">' + mcqState.total + '</div><div class="stat-label">Total</div></div>' +
        '</div>' +
        '<div class="grade-breakdown">' +
          '<div class="grade-breakdown-item"><div class="bd-label" style="color: #22c55e;">Easy</div><div class="bd-value" style="color: #e7e9ea;">' + mcqState.easyCorrect + ' / ' + mcqState.easyTotal + '</div></div>' +
          '<div class="grade-breakdown-item"><div class="bd-label" style="color: #fbbf24;">Medium</div><div class="bd-value" style="color: #e7e9ea;">' + mcqState.medCorrect + ' / ' + mcqState.medTotal + '</div></div>' +
          '<div class="grade-breakdown-item"><div class="bd-label" style="color: #ef4444;">Hard</div><div class="bd-value" style="color: #e7e9ea;">' + mcqState.hardCorrect + ' / ' + mcqState.hardTotal + '</div></div>' +
        '</div>';

      panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // ──────────────────────────────
    //  FORMAT: PRACTICE (with grading)
    // ──────────────────────────────
    function formatPractice(content) {
      practiceState = { total: 0, revealed: 0, easyTotal: 0, medTotal: 0, hardTotal: 0 };

      var formatted = '<div class="formatted-output">';
      formatted += '<h2 style="color: #1d9bf0; margin: 0 0 20px 0; font-size: 1.4rem; border-bottom: 2px solid rgba(29, 155, 240, 0.3); padding-bottom: 10px;">📝 Practice Questions — Solve & Reveal</h2>';

      var lines = content.split('\n');
      var questions = [];
      var currentQ = null;
      var currentDifficulty = 'medium';

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;

        // Detect difficulty headers
        if (line.match(/^##?\s*Easy/i) || line.match(/^Easy\s*$/i) || line.match(/^\*\*Easy\*\*/i)) {
          currentDifficulty = 'easy';
          continue;
        }
        if (line.match(/^##?\s*Medium/i) || line.match(/^Medium\s*$/i) || line.match(/^\*\*Medium\*\*/i)) {
          currentDifficulty = 'medium';
          continue;
        }
        if (line.match(/^##?\s*Hard/i) || line.match(/^Hard\s*$/i) || line.match(/^\*\*Hard\*\*/i)) {
          currentDifficulty = 'hard';
          continue;
        }

        // Question line
        if (line.match(/^Q\d+\.|^Question\s+\d+|^Problem\s+\d+/i)) {
          if (currentQ) questions.push(currentQ);
          var qText = line.replace(/^Q\d+\.?\s?|^Question\s+\d+\.?\s?|^Problem\s+\d+[:\s]?|^\d+\.\s+/, '').trim();
          currentQ = { question: '', solution: [], difficulty: currentDifficulty, inSolution: false };
          
          var solMatch = qText.match(/(Solution:|Answer:)\s*(.*)/i);
          if (solMatch) {
             currentQ.question = qText.substring(0, solMatch.index).trim();
             var solText = solMatch[2].trim();
             if (solText) currentQ.solution.push(solText);
             currentQ.inSolution = true;
          } else {
             currentQ.question = qText;
          }
        }
        else if (currentQ && !currentQ.inSolution && line.match(/(Solution:|Answer:)/i)) {
          var solMatch = line.match(/(Solution:|Answer:)\s*(.*)/i);
          currentQ.question += ' ' + line.substring(0, solMatch.index).trim();
          var solText = solMatch[2].trim();
          if (solText) currentQ.solution.push(solText);
          currentQ.inSolution = true;
        }
        else if (currentQ && currentQ.inSolution) {
          currentQ.solution.push(line);
        }
        else if (currentQ) {
          currentQ.question += ' ' + line;
        }
      }
      if (currentQ) questions.push(currentQ);

      practiceState.total = questions.length;
      questions.forEach(function(q) {
        if (q.difficulty === 'easy') practiceState.easyTotal++;
        else if (q.difficulty === 'medium') practiceState.medTotal++;
        else practiceState.hardTotal++;
      });

      var prevDifficulty = '';
      questions.forEach(function(qObj, idx) {
        if (qObj.difficulty !== prevDifficulty) {
          prevDifficulty = qObj.difficulty;
          var diffLabel = qObj.difficulty.charAt(0).toUpperCase() + qObj.difficulty.slice(1);
          formatted += '<div style="text-align: center; margin: 24px 0 16px 0;"><span class="difficulty-badge ' + qObj.difficulty + '">' + diffLabel + '</span></div>';
        }

        var pId = 'pq_' + idx;
        formatted += '<div style="background: linear-gradient(135deg, rgba(29, 155, 240, 0.06) 0%, rgba(113, 235, 245, 0.03) 100%); border: 2px solid #2f3336; border-radius: 10px; padding: 16px; margin: 14px 0;">';
        formatted += '<p style="color: #1d9bf0; font-weight: 600; margin-bottom: 10px;">📝 Q' + (idx + 1) + '.</p>';
        formatted += '<p style="color: #e7e9ea; margin-bottom: 12px; line-height: 1.7;">' + parseMarkdown(qObj.question) + '</p>';

        // Solution (hidden)
        formatted += '<button onclick="revealPracticeSolution(\'' + pId + '\')" id="' + pId + '_btn" style="background: rgba(29, 155, 240, 0.15); border: 1px solid #1d9bf0; color: #1d9bf0; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all 0.3s ease; margin-bottom: 8px;">👁 Show Solution</button>';
        formatted += '<div id="' + pId + '_sol" style="display:none; background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 8px; padding: 14px; margin-top: 10px;">';
        formatted += '<p style="color: #22c55e; font-weight: 600; margin-bottom: 8px;">✓ Solution:</p>';
        qObj.solution.forEach(function(solLine) {
          formatted += '<p style="color: #bab9b4; margin: 6px 0; padding-left: 12px; border-left: 2px solid rgba(34, 197, 94, 0.4); line-height: 1.7;">' + parseMarkdown(solLine) + '</p>';
        });
        formatted += '</div>';
        formatted += '</div>';
      });

      // Grading summary for practice
      formatted += '<div id="practiceGradePanel" class="grade-panel" style="margin-top: 24px;">';
      formatted += '<h2>📊 Progress Tracker</h2>';
      formatted += '<p style="color: #71767b; margin: 8px 0;" id="practiceProgress">Solutions revealed: 0 / ' + practiceState.total + '</p>';
      formatted += '<div class="grade-breakdown">' +
        '<div class="grade-breakdown-item"><div class="bd-label" style="color: #22c55e;">Easy</div><div class="bd-value" style="color: #e7e9ea;">' + practiceState.easyTotal + ' Qs</div></div>' +
        '<div class="grade-breakdown-item"><div class="bd-label" style="color: #fbbf24;">Medium</div><div class="bd-value" style="color: #e7e9ea;">' + practiceState.medTotal + ' Qs</div></div>' +
        '<div class="grade-breakdown-item"><div class="bd-label" style="color: #ef4444;">Hard</div><div class="bd-value" style="color: #e7e9ea;">' + practiceState.hardTotal + ' Qs</div></div>' +
      '</div>';
      formatted += '</div>';

      formatted += '</div>';
      return formatted;
    }

    window.revealPracticeSolution = function(pId) {
      var sol = document.getElementById(pId + '_sol');
      var btn = document.getElementById(pId + '_btn');
      if (sol.style.display === 'none') {
        sol.style.display = 'block';
        btn.textContent = '🙈 Hide Solution';
        btn.style.background = 'rgba(34, 197, 94, 0.15)';
        btn.style.borderColor = '#22c55e';
        btn.style.color = '#22c55e';
        practiceState.revealed++;
      } else {
        sol.style.display = 'none';
        btn.textContent = '👁 Show Solution';
        btn.style.background = 'rgba(29, 155, 240, 0.15)';
        btn.style.borderColor = '#1d9bf0';
        btn.style.color = '#1d9bf0';
        practiceState.revealed--;
      }
      var progressEl = document.getElementById('practiceProgress');
      if (progressEl) {
        progressEl.textContent = 'Solutions revealed: ' + practiceState.revealed + ' / ' + practiceState.total;
      }
    };

    // ──────────────────────────────
    //  FORMAT: FLASHCARDS
    // ──────────────────────────────
    function formatFlashcards(content) {
      var formatted = '<div class="formatted-output">';
      var cards = [];
      var lines = content.split('\n');
      var currentCard = {};

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;

        if (line.match(/^Front:/i)) {
          if (currentCard.front && currentCard.back) {
            cards.push(currentCard);
          }
          currentCard = { front: line.replace(/^Front:\s?/i, '').trim(), back: '' };
        } else if (line.match(/^Back:/i)) {
          currentCard.back = line.replace(/^Back:\s?/i, '').trim();
        } else if (currentCard.front && !currentCard.back) {
          currentCard.front += ' ' + line;
        } else if (currentCard.front && currentCard.back) {
          currentCard.back += ' ' + line;
        }
      }

      if (currentCard.front && currentCard.back) {
        cards.push(currentCard);
      }

      formatted += '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 20px 0;">';
      for (var j = 0; j < cards.length; j++) {
        var card = cards[j];
        var frontText = parseMarkdown(card.front);
        var backText = parseMarkdown(card.back);

        formatted += '<div class="flashcard" style="background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%); border-radius: 12px; padding: 20px; color: #fff; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 8px 24px rgba(29, 155, 240, 0.2); font-weight: 500; line-height: 1.6; cursor: pointer; transition: transform 0.3s;">';
        formatted += '<div style="font-size: 0.8rem; color: rgba(255,255,255,0.7); margin-bottom: 8px; font-weight: 400;">Card ' + (j + 1) + ' (Front)</div>';
        formatted += '<div style="font-size: 1rem;">' + frontText + '</div></div>';

        formatted += '<div class="flashcard back" style="background: linear-gradient(135deg, rgba(113, 235, 245, 0.2) 0%, rgba(29, 155, 240, 0.1) 100%); border: 2px solid #71ebf5; border-radius: 12px; padding: 20px; color: #71ebf5; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-weight: 500; line-height: 1.6; cursor: pointer; transition: transform 0.3s;">';
        formatted += '<div style="font-size: 0.8rem; color: rgba(113, 235, 245, 0.7); margin-bottom: 8px; font-weight: 400;">Card ' + (j + 1) + ' (Answer)</div>';
        formatted += '<div style="font-size: 1rem;">' + backText + '</div></div>';
      }
      formatted += '</div></div>';
      return formatted;
    }

    // ──────────────────────────────
    //  FORMAT: SUMMARY
    // ──────────────────────────────
    function formatSummary(content) {
      var formatted = '<div class="formatted-output">';
      var lines = content.split('\n');
      var inList = false;
      var listType = '';

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) {
          if (inList) {
            formatted += listType === 'ul' ? '</ul>' : '</ol>';
            inList = false;
          }
          formatted += '<div style="height: 8px;"></div>';
          continue;
        }

        // Headings with # or bolded section titles
        if (line.match(/^#{1,6}\s/) || (line.match(/^\*\*[^*]+\*\*$/) && line.length < 50) || line.match(/^(Must-Know|Quick Facts|Exam Questions|Mnemonics|Key Points|Important|Key Formulas|Key Terms|Tips and Tricks)/i)) {
          if (inList) {
            formatted += listType === 'ul' ? '</ul>' : '</ol>';
            inList = false;
          }
          var level = line.match(/^#+/) ? line.match(/^#+/)[0].length : 2;
          var text = line.replace(/^#+\s/, '').replace(/\*\*/g, '').trim();
          text = parseMarkdown(text);
          formatted += '<h' + (level + 1) + ' style="color: #1d9bf0; margin: 24px 0 12px 0; border-bottom: 2px solid rgba(29, 155, 240, 0.2); padding-bottom: 8px;">' + text + '</h' + (level + 1) + '>';
        }
        // Sub-items with dashes or bullets
        else if (line.match(/^[-–•*]\s/) || line.match(/^\s+[-–•*]\s/)) {
          if (!inList || listType !== 'ul') {
            if (inList) formatted += '</ol>';
            formatted += '<ul style="margin: 10px 0 10px 20px; list-style: none;">';
            inList = true;
            listType = 'ul';
          }
          var itemText = line.replace(/^\s*[-–•*]\s/, '').trim();
          itemText = parseMarkdown(itemText);
          formatted += '<li style="margin: 8px 0; padding-left: 20px; position: relative; line-height: 1.7; color: #e7e9ea;"><span style="position: absolute; left: 0; color: #1d9bf0;">•</span>' + itemText + '</li>';
        }
        // Numbered list
        else if (line.match(/^\d+\.\s/)) {
          if (!inList || listType !== 'ol') {
            if (inList) formatted += '</ul>';
            formatted += '<ol style="margin: 10px 0 10px 40px; color: #1d9bf0; line-height: 1.7;">';
            inList = true;
            listType = 'ol';
          }
          var itemText = line.replace(/^\d+\.\s/, '').trim();
          itemText = parseMarkdown(itemText);
          formatted += '<li style="margin: 8px 0; color: #e7e9ea;"><span style="color: #e7e9ea;">' + itemText + '</span></li>';
        }
        // Definition lines (e.g. "Term: Definition")
        else if (line.match(/^[A-Za-z\s]+:/) || line.match(/^\*\*[^*]+\*\*:/)) {
          if (inList) {
            formatted += listType === 'ul' ? '</ul>' : '</ol>';
            inList = false;
          }
          var defText = parseMarkdown(line);
          formatted += '<p style="margin: 12px 0; padding: 12px 16px; background: rgba(29, 155, 240, 0.05); border-left: 4px solid #1d9bf0; border-radius: 6px; color: #e7e9ea;">' + defText + '</p>';
        }
        // Normal paragraph
        else {
          if (inList) {
            formatted += listType === 'ul' ? '</ul>' : '</ol>';
            inList = false;
          }
          var pText = parseMarkdown(line);
          formatted += '<p style="margin: 10px 0; line-height: 1.8; color: #bab9b4;">' + pText + '</p>';
        }
      }

      if (inList) {
        formatted += listType === 'ul' ? '</ul>' : '</ol>';
      }
      formatted += '</div>';
      return formatted;
    }

    // ──────────────────────────────
    //  FORMAT: MINDMAP
    // ──────────────────────────────
    function formatMindmap(content) {
      var formatted = '<div class="formatted-output" style="background: #0f1419; padding: 20px; border-radius: 12px; font-family: monospace;">';
      var lines = content.split('\n');
      var tree = buildMindmapTree(lines);
      formatted += renderMindmapTree(tree);
      formatted += '</div>';
      return formatted;
    }

    function buildMindmapTree(lines) {
      var tree = { level: -1, text: 'root', children: [], id: 'root' };
      var stack = [tree];
      var nodeId = 0;

      lines.forEach(function(line) {
        var indent = line.search(/\S/);
        if (indent === -1) return;
        var text = line.trim();
        if (!text) return;

        var level = Math.floor(indent / 2);
        var node = { level: level, text: text.replace(/^[-•*]\s?/, '').trim(), children: [], id: 'node' + (nodeId++) };

        while (stack.length > 1 && stack[stack.length - 1].level >= level) {
          stack.pop();
        }

        stack[stack.length - 1].children.push(node);
        stack.push(node);
      });

      return tree;
    }

    function renderMindmapTree(node, isRoot) {
      if (isRoot === undefined) isRoot = true;
      var colors = ['#1d9bf0', '#71ebf5', '#a8e6a1', '#ff9ab3', '#ffc857', '#ff6b9d'];
      var color = colors[node.level + 1] || colors[colors.length - 1];

      if (isRoot && node.level === -1) {
        var html = '<div>';
        node.children.forEach(function(child) {
          html += renderMindmapTree(child, false);
        });
        html += '</div>';
        return html;
      }

      var hasChildren = node.children && node.children.length > 0;
      var text = parseMarkdown(node.text);
      var size = [1.3, 1.1, 0.95, 0.85, 0.75][Math.min(node.level + 1, 4)];
      var weight = node.level === 0 ? 700 : node.level === 1 ? 600 : node.level === 2 ? 500 : 400;

      var html = '<div style="margin: 8px 0; margin-left: ' + ((node.level + 1) * 24) + 'px;">';

      if (hasChildren) {
        html += '<div style="cursor: pointer; padding: 8px 12px; background: linear-gradient(135deg, rgba(' + hexToRgba(color) + ', 0.2) 0%, rgba(' + hexToRgba(color) + ', 0.05) 100%); border-left: 4px solid ' + color + '; border-radius: 6px; margin: 4px 0; font-size: ' + size + 'rem; font-weight: ' + weight + '; color: ' + color + '; display: flex; align-items: center; gap: 8px;" onclick="toggleMindmapBranch(this)">';
        html += '<span style="display: inline-block; min-width: 20px; text-align: center; transition: transform 0.3s;">▶</span>';
        html += '<span>' + text + '</span></div>';
        html += '<div style="display: none;" class="mindmap-branch">';
        node.children.forEach(function(child) {
          html += renderMindmapTree(child, false);
        });
        html += '</div>';
      } else {
        html += '<div style="padding: 8px 12px; background: rgba(' + hexToRgba(color) + ', 0.1); border-left: 3px solid ' + color + '; border-radius: 6px; margin: 4px 0; font-size: ' + size + 'rem; font-weight: ' + weight + '; color: ' + color + ';">' + text + '</div>';
      }

      html += '</div>';
      return html;
    }

    function hexToRgba(hex) {
      var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? parseInt(result[1], 16) + ',' + parseInt(result[2], 16) + ',' + parseInt(result[3], 16) : '29,155,240';
    }

    window.toggleMindmapBranch = function(element) {
      var branch = element.nextElementSibling;
      var arrow = element.querySelector('span:first-child');
      if (branch && branch.classList.contains('mindmap-branch')) {
        if (branch.style.display === 'none') {
          branch.style.display = 'block';
          arrow.style.transform = 'rotate(90deg)';
        } else {
          branch.style.display = 'none';
          arrow.style.transform = 'rotate(0deg)';
        }
      }
    };

    // ──────────────────────────────
    //  FORMAT DISPATCHER
    // ──────────────────────────────
    function formatContent(type, content) {
      switch(type) {
        case 'notes': return formatNotes(content);
        case 'mcq': return formatMCQ(content);
        case 'practice': return formatPractice(content);
        case 'flashcards': return formatFlashcards(content);
        case 'summary': return formatSummary(content);
        case 'mindmap': return formatMindmap(content);
        default: return '<div class="formatted-output"><p>' + parseMarkdown(content) + '</p></div>';
      }
    }

    async function generate() {
      var topic = document.getElementById('topic').value.trim();
      if (!topic) {
        showToast('⚠️ Please enter a topic');
        return;
      }
      var key = document.getElementById('apiKey').value.trim();
      if (!key) {
        showToast('⚠️ Please paste your API key');
        return;
      }
      var provider = document.getElementById('apiProvider').value;
      var subject = document.getElementById('subject').value;
      var grade = document.getElementById('grade').value;
      var loader = document.getElementById('loader');
      loader.style.display = 'flex';
      updateLoaderMsg('Generating material...');
      try {
        var prompt = getPrompt(contentType, topic, subject, grade);
        var result = await callAPI(provider, key, prompt);
        historyData.push({
          topic: topic,
          type: contentType,
          content: result
        });
        currentHistIdx = historyData.length - 1;
        showResult(result, contentType);
        renderHistory();
        showToast('✨ Material generated successfully!');
      } catch (e) {
        showErrorModal(e.message, provider);
      } finally {
        loader.style.display = 'none';
        updateLoaderMsg('Generating material...');
      }
    }

    function showErrorModal(message, provider) {
      // Remove existing modal if any
      var existing = document.getElementById('errorModal');
      if (existing) existing.remove();

      var tips = '';
      if (message.indexOf('tokens per minute') !== -1 || message.indexOf('rate') !== -1 || message.indexOf('429') !== -1) {
        tips = '<p style="color: #fbbf24; margin-top: 10px;">💡 <strong>Tip:</strong> Groq free tier has a low token limit. Wait 60 seconds and try again, or switch to <strong>Gemini</strong> which has a much more generous free tier.</p>';
      } else if (message.indexOf('401') !== -1 || message.indexOf('invalid') !== -1 || message.indexOf('Incorrect') !== -1) {
        tips = '<p style="color: #fbbf24; margin-top: 10px;">💡 <strong>Tip:</strong> Your API key appears to be invalid. Double-check that you copied the full key from your ' + provider + ' dashboard.</p>';
      } else if (message.indexOf('Network') !== -1 || message.indexOf('fetch') !== -1) {
        tips = '<p style="color: #fbbf24; margin-top: 10px;">💡 <strong>Tip:</strong> Check your internet connection and try again.</p>';
      }

      var modal = document.createElement('div');
      modal.id = 'errorModal';
      modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,20,25,0.9);display:flex;justify-content:center;align-items:center;z-index:1002;backdrop-filter:blur(6px);';
      modal.innerHTML = '<div style="background:linear-gradient(135deg,#16181c,#1a1f2e);border:2px solid #ef4444;border-radius:16px;padding:28px;max-width:500px;width:90%;box-shadow:0 8px 32px rgba(239,68,68,0.2);">' +
        '<h3 style="color:#ef4444;margin-bottom:14px;font-size:1.2rem;">⚠️ API Error</h3>' +
        '<p style="color:#bab9b4;line-height:1.6;font-size:0.9rem;word-break:break-word;">' + message + '</p>' +
        tips +
        '<div style="display:flex;gap:10px;margin-top:20px;">' +
          '<button onclick="document.getElementById(\'errorModal\').remove(); generate();" style="flex:1;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#1d9bf0,#1a8cd8);color:#fff;font-weight:600;cursor:pointer;transition:all 0.3s;">🔄 Retry</button>' +
          '<button onclick="document.getElementById(\'errorModal\').remove()" style="flex:1;padding:12px;border-radius:10px;border:1px solid #2f3336;background:#0f1419;color:#71767b;font-weight:500;cursor:pointer;transition:all 0.3s;">Dismiss</button>' +
        '</div>' +
      '</div>';
      document.body.appendChild(modal);
    }

    function showResult(content, type) {
      var resultCard = document.getElementById('resultCard');
      var outputDiv = document.getElementById('outputContent');

      // Store raw content
      outputDiv.style.display = 'none';
      outputDiv.textContent = content;

      // Show formatted content
      if (!resultCard.querySelector('.formatted-output')) {
        var formattedDiv = document.createElement('div');
        formattedDiv.id = 'formattedOutput';
        resultCard.appendChild(formattedDiv);
      }

      document.getElementById('formattedOutput').innerHTML = formatContent(type, content);
      resultCard.style.display = 'block';
      renderHistTabs();
    }

    function renderHistTabs() {
      var tabs = document.getElementById('histTabs');
      tabs.innerHTML = '';
      for (var i = 0; i < historyData.length; i++) {
        var h = historyData[i];
        var t = document.createElement('div');
        t.className = 'hist-tab' + (i === currentHistIdx ? ' active' : '');
        t.textContent = h.topic + ' (' + h.type + ')';
        t.onclick = (function(idx) {
          return function() {
            currentHistIdx = idx;
            showResult(historyData[idx].content, historyData[idx].type);
          };
        })(i);
        tabs.appendChild(t);
      }
    }

    function renderHistory() {
      var list = document.getElementById('historyList');
      list.innerHTML = '';
      for (var i = historyData.length - 1; i >= 0; i--) {
        var h = historyData[i];
        var item = document.createElement('div');
        item.className = 'hist-item';
        item.innerHTML = '<span>📚 ' + h.topic + ' - <strong>' + h.type + '</strong></span><span class="del-btn" onclick="delHistory(' + i + ', event)">×</span>';
        item.onclick = function(idx) {
          return function(e) {
            if (e.target.classList.contains('del-btn')) return;
            currentHistIdx = idx;
            showResult(historyData[idx].content, historyData[idx].type);
            document.getElementById('resultCard').style.display = 'block';
            renderHistTabs();
          };
        }(i);
        list.appendChild(item);
      }
    }

    function delHistory(idx, event) {
      event.stopPropagation();
      historyData.splice(idx, 1);
      if (currentHistIdx >= historyData.length) currentHistIdx = historyData.length - 1;
      if (historyData.length === 0) {
        document.getElementById('historyCard').style.display = 'none';
        document.getElementById('resultCard').style.display = 'none';
      } else {
        showResult(historyData[currentHistIdx].content, historyData[currentHistIdx].type);
      }
      renderHistory();
      renderHistTabs();
    }

    function copyOutput() {
      var text = document.getElementById('outputContent').textContent;
      navigator.clipboard.writeText(text).then(function() {
        showToast('✓ Copied to clipboard!');
      }).catch(function() {
        alert('Failed to copy');
      });
    }

    function downloadOutput() {
      var text = document.getElementById('outputContent').textContent;
      var blob = new Blob([text], {
        type: 'text/plain'
      });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'StudyForAll-' + contentType + '-' + new Date().toISOString().slice(0, 10) + '.txt';
      a.click();
      URL.revokeObjectURL(url);
      showToast('⬇️ Downloaded successfully!');
    }
  </script>
