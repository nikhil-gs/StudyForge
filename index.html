    </div>
    <button class="generate-btn" onclick="generate()">Generate Material</button>
  </div>

  <div class="card" id="historyCard" style="display:none">
    <h3>History</h3>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="card result-card" id="resultCard" style="display:none">
    <div class="history-tabs">
      <span class="tab-label">📋 Your Generations:</span>
      <div class="hist-tabs" id="histTabs"></div>
    </div>
    <div class="out-actions">
      <button class="action-btn" onclick="copyOutput()">📋 Copy</button>
      <button class="action-btn" onclick="downloadOutput()">⬇️ Download</button>
    </div>
    <div id="formattedOutput"></div>
    <pre class="output-content" id="outputContent" style="display:none;"></pre>
  </div>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <p>Generating material...</p>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var contentType = 'notes';
    var historyData = [];
    var currentHistIdx = 0;

    // ── MCQ / Practice grading state ──
    var mcqState = { total: 0, correct: 0, answered: 0, easyCorrect: 0, easyTotal: 0, medCorrect: 0, medTotal: 0, hardCorrect: 0, hardTotal: 0 };
    var practiceState = { total: 0, revealed: 0, easyTotal: 0, medTotal: 0, hardTotal: 0 };

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() {
        t.classList.remove('show');
      }, 2500);
    }

    function showProviderLink() {
      var p = document.getElementById('apiProvider').value;
      var links = {
        groq: 'https://console.groq.com/keys',
        gemini: 'https://aistudio.google.com/app/apikey',
        openai: 'https://platform.openai.com/api-keys'
      };
      window.open(links[p], '_blank');
    }

    function setType(t) {
      contentType = t;
      var btns = document.querySelectorAll('.type-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('active');
      }
      document.querySelector('[data-type="' + t + '"]').classList.add('active');
    }

    function getPrompt(type, topic, subject, grade) {
      var gradeLabel = grade === 'UG' ? 'Undergraduate' : 'Grade ' + grade;
      var detailLevel = grade === 'UG' ? 'comprehensive university-level' : 'detailed';
      var syllabusNote = grade === 'UG' ? 'Cover all major concepts from standard university curriculum.' : 'Cover all major concepts from the syllabus.';

      var prompts = {
        notes: 'Create ' + detailLevel + ' study notes for ' + gradeLabel + ' ' + subject + ' on "' + topic + '". ' + syllabusNote + '\n\n' +
          'Write the answer in GitHub-flavoured Markdown, using exactly these headings:\n' +
          '## 1. Introduction & Definition\n## 2. Historical Context\n## 3. Key Concepts\n## 4. Detailed Explanation\n' +
          '## 5. Important Formulas, Rules & Laws\n## 6. Applications & Real-World Examples\n' +
          '## 7. Common Misconceptions & Mistakes\n## 8. Advanced Topics\n## 9. Summary\n\n' +
          'Formatting rules:\n' +
          '- Use a Markdown table wherever you compare things, list formulas alongside what each symbol means, or present any structured data. Prefer a table over a long bullet list for comparisons. Always include the header row and the |---|---| separator row.\n' +
          '- Bold every key term with **term** the first time it appears.\n' +
          '- Write definitions on their own line as "**Term:** explanation".\n' +
          '- Use backticks for symbols, variables, units and code.\n' +
          '- Use "- " for bullets, indenting sub-points by exactly 2 spaces.\n' +
          '- Include several worked examples with real numbers.\n' +
          'Be thorough and in depth in every section.',

        mcq: 'Generate exactly 15 MCQs for ' + gradeLabel + ' ' + subject + ' on "' + topic + '". ' +
          'Organise them into Easy, Medium and Hard sections with 5 questions each.\n\n' +
          'Use this EXACT format. Keep every label plain — do not bold them, do not add extra punctuation:\n\n' +
          '## Easy\n\n' +
          'Q1. [Question text]\n' +
          'A) [Option]\n' +
          'B) [Option]\n' +
          'C) [Option]\n' +
          'D) [Option]\n' +
          'Answer: B\n' +
          'Explanation: [Why B is correct]\n\n' +
          '(then Q2 to Q5 in the same shape)\n\n' +
          '## Medium\n\n(Q6 to Q10)\n\n## Hard\n\n(Q11 to Q15)\n\n' +
          'Every question needs 4 options labelled A) to D), one "Answer:" line holding just the letter, and one "Explanation:" line. ' +
          'Number the questions continuously from Q1 to Q15 and make them genuinely increase in difficulty.',

        practice: 'Create exactly 15 practice questions with full solutions for ' + gradeLabel + ' ' + subject + ' on "' + topic + '". ' +
          'Organise them into Easy, Medium and Hard sections with 5 questions each.\n\n' +
          'Use this EXACT format. Keep the "Solution:" label plain and on its own line:\n\n' +
          '## Easy\n\n' +
          'Q1. [Full question text]\n\n' +
          'Solution:\n' +
          '[Step-by-step working]\n\n' +
          '(then Q2 to Q5 in the same shape)\n\n' +
          '## Medium\n\n(Q6 to Q10)\n\n## Hard\n\n(Q11 to Q15)\n\n' +
          'Inside a solution you may use Markdown: numbered steps, **bold** for results, backticks for formulas, and tables for structured data. ' +
          'Number the questions continuously from Q1 to Q15 and show complete working for every one.',

        flashcards: 'Create exactly 15 flashcards for ' + gradeLabel + ' ' + subject + ' on "' + topic + '".\n\n' +
          'Use this EXACT format, one card per pair, with a blank line between cards:\n\n' +
          'Front: [Question or term]\n' +
          'Back: [Answer or definition]\n\n' +
          'Front: [Question or term]\n' +
          'Back: [Answer or definition]\n\n' +
          'Keep every label plain — do not bold "Front" or "Back", and do not number the cards. ' +
          'Keep each side under 40 words so it fits on a card.',

        summary: 'Create a detailed revision summary for ' + gradeLabel + ' ' + subject + ' on "' + topic + '".\n\n' +
          'Write it in GitHub-flavoured Markdown using exactly these headings:\n' +
          '## 1. Must-Know Concepts\n## 2. Quick Facts\n## 3. Key Formulas\n## 4. Common Exam Questions\n## 5. Mnemonics & Memory Aids\n\n' +
          'Formatting rules:\n' +
          '- Put Key Formulas in a Markdown table with columns: Formula | What it means | When to use it. Include the |---|---| separator row.\n' +
          '- Put Quick Facts in a Markdown table where the data is comparable.\n' +
          '- Bold every key term with **term**, and use backticks for symbols and units.\n' +
          '- Use "- " for bullets, indenting sub-points by exactly 2 spaces.\n' +
          'Give several items under every heading.',

        mindmap: 'Create a structured mind map for "' + topic + '" suitable for ' + gradeLabel + ' ' + subject + '.\n\n' +
          'Output nothing but the tree. Use "- " bullets and indent each level by exactly 2 more spaces:\n\n' +
          '- ' + topic + '\n' +
          '  - Main Branch 1\n' +
          '    - Sub-topic 1.1\n' +
          '      - Point 1.1.1\n' +
          '      - Point 1.1.2\n' +
          '    - Sub-topic 1.2\n' +
          '  - Main Branch 2\n' +
          '    - Sub-topic 2.1\n\n' +
          'Give 4 to 6 main branches, each with 2 to 4 sub-topics, each with 2 to 3 points. ' +
          'No headings, no prose, no bold — just the indented bullet tree.'
      };

      return prompts[type];
    }

    // ── API key handling ──
    // Copy-pasted keys often carry spaces, newlines or zero-width characters.
    function cleanKey(value) {
      return String(value || '').replace(/[\s\u200B-\u200D\uFEFF]/g, '');
    }

    // Catches the most common paste mistakes before we spend a request on them.
    function checkKeyShape(provider, key) {
      if (provider === 'groq' && key.indexOf('gsk_') !== 0) {
        return '⚠️ Groq keys start with "gsk_" — check you copied the whole key';
      }
      if (provider === 'openai' && key.indexOf('sk-') !== 0) {
        return '⚠️ OpenAI keys start with "sk-" — check you copied the whole key';
      }
      if (provider === 'gemini' && key.indexOf('AIza') !== 0) {
        return '⚠️ Gemini keys start with "AIza" — check you copied the whole key';
      }
      return '';
    }

    // Keys are kept per provider in this browser only; they are never sent anywhere
    // except that provider's own API.
    function saveKey(provider, key) {
      try { localStorage.setItem('sf_key_' + provider, key); } catch (e) {}
    }

    function loadKey() {
      var provider = document.getElementById('apiProvider').value;
      var input = document.getElementById('apiKey');
      try { input.value = localStorage.getItem('sf_key_' + provider) || ''; } catch (e) {}
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadKey();
      document.getElementById('apiProvider').addEventListener('change', loadKey);
    });

    // ── Model IDs (kept in one place so they are easy to update) ──
    var MODELS = {
      groq: 'openai/gpt-oss-20b',
      gemini: 'gemini-3.5-flash',
      openai: 'gpt-4.1-mini'
    };

    // Reads the body once and tolerates non-JSON error pages (proxies, gateways).
    async function readBody(res) {
      var raw = await res.text();
      try {
        return { json: JSON.parse(raw), raw: raw };
      } catch (e) {
        return { json: null, raw: raw };
      }
    }

    // Turns any failed response into a message the user can act on.
    function apiError(providerName, res, body) {
      var msg = body.json && body.json.error
        ? (body.json.error.message || body.json.error.code || JSON.stringify(body.json.error))
        : (body.raw || '').slice(0, 200);

      if (res.status === 401 || res.status === 403) {
        return new Error('Invalid or unauthorized API key (HTTP ' + res.status + '). ' + msg);
      }
      if (res.status === 404 || /decommission|deprecat|not found|does not exist|no longer supported/i.test(msg)) {
        return new Error('The model this app requests is no longer available on ' + providerName +
          '. Update MODELS.' + providerName.toLowerCase() + ' in the code. Details: ' + msg);
      }
      return new Error(msg || (providerName + ' API error (HTTP ' + res.status + ')'));
    }

    async function callAPI(provider, key, prompt, retryCount) {
      retryCount = retryCount || 0;
      var maxRetries = 2;

      // Strip stray whitespace/zero-width characters that survive a copy-paste.
      key = cleanKey(key);

      try {
        if (provider === 'groq') {
          var res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + key
            },
            body: JSON.stringify({
              model: MODELS.groq,
              messages: [{
                role: 'user',
                content: prompt
              }],
              max_completion_tokens: 8192,
              reasoning_effort: 'low'
            })
          });
          var body = await readBody(res);
          if (!res.ok) {
            // Rate limit — auto-retry after delay
            if (res.status === 429 && retryCount < maxRetries) {
              var waitSec = parseInt(res.headers.get('retry-after'), 10) || (retryCount + 1) * 15;
              updateLoaderMsg('⏳ Rate limited — retrying in ' + waitSec + 's...');
              await sleep(waitSec * 1000);
              return callAPI(provider, key, prompt, retryCount + 1);
            }
            throw apiError('Groq', res, body);
          }
          var gChoice = body.json && body.json.choices && body.json.choices[0];
          var gText = gChoice && gChoice.message ? gChoice.message.content : '';
          if (!gText) throw new Error('Groq returned an empty response — try again or shorten the topic.');
          return gText;
        } else if (provider === 'gemini') {
          var res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + MODELS.gemini + ':generateContent', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-goog-api-key': key
            },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: prompt
                }]
              }],
              generationConfig: {
                maxOutputTokens: 8192
              }
            })
          });
          var body = await readBody(res);
          if (!res.ok) {
            if (res.status === 429 && retryCount < maxRetries) {
              var waitSec = (retryCount + 1) * 15;
              updateLoaderMsg('⏳ Rate limited — retrying in ' + waitSec + 's...');
              await sleep(waitSec * 1000);
              return callAPI(provider, key, prompt, retryCount + 1);
            }
            throw apiError('Gemini', res, body);
          }
          // Newer Gemini models can return internal "thought" parts — keep only real text.
          var cand = body.json && body.json.candidates && body.json.candidates[0];
          var parts = cand && cand.content ? (cand.content.parts || []) : [];
          var text = '';
          for (var p = 0; p < parts.length; p++) {
            if (parts[p].text && !parts[p].thought) text += parts[p].text;
          }
          if (!text) {
            var why = cand && cand.finishReason ? ' (finishReason: ' + cand.finishReason + ')' : '';
            throw new Error('Gemini returned no text' + why + ' — try again or rephrase the topic.');
          }
          return text;
        } else if (provider === 'openai') {
          var res = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + key
            },
            body: JSON.stringify({
              model: MODELS.openai,
              messages: [{
                role: 'user',
                content: prompt
              }],
              max_completion_tokens: 8192
            })
          });
          var body = await readBody(res);
          if (!res.ok) {
            if (res.status === 429 && retryCount < maxRetries) {
              var waitSec = parseInt(res.headers.get('retry-after'), 10) || (retryCount + 1) * 15;
              updateLoaderMsg('⏳ Rate limited — retrying in ' + waitSec + 's...');
              await sleep(waitSec * 1000);
              return callAPI(provider, key, prompt, retryCount + 1);
            }
            throw apiError('OpenAI', res, body);
          }
          var oChoice = body.json && body.json.choices && body.json.choices[0];
          var oText = oChoice && oChoice.message ? oChoice.message.content : '';
          if (!oText) throw new Error('OpenAI returned an empty response — try again or shorten the topic.');
          return oText;
        }
        throw new Error('Unknown provider: ' + provider);
      } catch (err) {
        if (err.message && err.message.indexOf('Failed to fetch') !== -1) {
          throw new Error('Network error — check your internet connection and try again. (If you opened this file directly from disk, serve it over http:// instead.)');
        }
        throw err;
      }
    }

    function sleep(ms) {
      return new Promise(function(resolve) { setTimeout(resolve, ms); });
    }

    function updateLoaderMsg(msg) {
      var loaderP = document.querySelector('.loader p');
      if (loaderP) loaderP.textContent = msg;
    }

    // ══════════════════════════════
    //  MARKDOWN RENDERER
    // ══════════════════════════════

    function escapeHtml(text) {
      var map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      var s = (text === null || text === undefined) ? '' : String(text);
      return s.replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    // Inline formatting. The text is escaped before any markup is added, so model
    // output can never inject HTML; code spans are lifted out beforehand so their
    // contents survive verbatim.
    function renderInline(text) {
      var codes = [];
      var out = (text === null || text === undefined) ? '' : String(text);

      out = out.replace(/`([^`\n]+)`/g, function(m, code) {
        codes.push(code);
        return '@@CODE' + (codes.length - 1) + '@@';
      });

      out = escapeHtml(out);

      // Links are restricted to http(s) so an escaped javascript: URL cannot slip through.
      out = out.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer" class="md-link">$1</a>');

      out = out.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
      out = out.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
      out = out.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>');
      out = out.replace(/___([^_\n]+)___/g, '<strong><em>$1</em></strong>');
      // Underscore emphasis only at word boundaries, so snake_case identifiers survive.
      out = out.replace(/(^|[^\w_])__([^_\n]+)__(?!\w)/g, '$1<strong>$2</strong>');
      out = out.replace(/(^|[^\w_])_([^_\n]+)_(?!\w)/g, '$1<em>$2</em>');
      out = out.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');

      return out.replace(/@@CODE(\d+)@@/g, function(m, idx) {
        return '<code class="md-code">' + escapeHtml(codes[idx]) + '</code>';
      });
    }

    function isTableDivider(line) {
      return line.indexOf('|') !== -1 &&
        /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line);
    }

    function splitTableRow(line) {
      var s = line.trim().replace(/\\\|/g, '@@PIPE@@');
      if (s.charAt(0) === '|') s = s.slice(1);
      if (s.charAt(s.length - 1) === '|') s = s.slice(0, -1);
      var cells = s.split('|');
      for (var i = 0; i < cells.length; i++) {
        cells[i] = cells[i].replace(/@@PIPE@@/g, '|').trim();
      }
      return cells;
    }

    function tableAlignments(dividerLine) {
      var cells = splitTableRow(dividerLine);
      var out = [];
      for (var i = 0; i < cells.length; i++) {
        var c = cells[i];
        var left = c.charAt(0) === ':';
        var right = c.charAt(c.length - 1) === ':';
        out.push(left && right ? 'center' : (right ? 'right' : 'left'));
      }
      return out;
    }

    // A nested bullet has to be indented at least this far to count as a new level.
    var LIST_INDENT_STEP = 2;

    // Block-level markdown: fenced code, GFM tables, headings, nested lists,
    // blockquotes, rules and paragraphs.
    function renderMarkdown(md, opts) {
      opts = opts || {};
      var src = (md === null || md === undefined) ? '' : String(md);
      var lines = src.replace(/\r\n?/g, '\n').split('\n');
      var html = '';
      var para = [];
      var quote = [];
      var stack = [];

      function flushPara() {
        if (!para.length) return;
        var text = para.join(' ').trim();
        para = [];
        if (!text) return;
        // "**Term:** definition" earns the highlighted definition treatment. The
        // rule is deliberately narrow — the old "any capitalised line with a colon"
        // heuristic boxed ordinary sentences.
        var def = text.match(/^\*\*([^*\n]{1,80}?)\*\*\s*:\s*(.+)$/) ||
                  text.match(/^\*\*([^*\n]{1,80}?):\*\*\s*(.+)$/);
        if (def) {
          html += '<p class="md-def"><span class="md-def-term">' + renderInline(def[1]) +
            ':</span> ' + renderInline(def[2]) + '</p>';
        } else {
          html += '<p>' + renderInline(text) + '</p>';
        }
      }

      function flushQuote() {
        if (!quote.length) return;
        html += '<blockquote class="md-quote">' + renderInline(quote.join(' ')) + '</blockquote>';
        quote = [];
      }

      function closeListsDeeperThan(indent) {
        while (stack.length && stack[stack.length - 1].indent > indent) {
          html += '</li></' + stack.pop().type + '>';
        }
      }

      function closeAllLists() {
        while (stack.length) {
          html += '</li></' + stack.pop().type + '>';
        }
      }

      function flushBlocks() {
        flushPara();
        flushQuote();
        closeAllLists();
      }

      function addHeading(level, text) {
        var badge = '';
        var body = text;
        var num = opts.badgeNumbers ? text.match(/^(\d{1,2})[.)]\s+(.*)$/) : null;
        if (num) {
          badge = '<span class="md-secnum">' + num[1] + '</span>';
          body = num[2];
        }
        var tag = 'h' + Math.min(level + 1, 6);
        html += '<' + tag + ' class="md-h">' + badge + '<span>' + renderInline(body) + '</span></' + tag + '>';
      }

      for (var i = 0; i < lines.length; i++) {
        var raw = lines[i];
        var line = raw.trim();

        // ── Fenced code block ──
        var fence = line.match(/^(```+|~~~+)\s*([A-Za-z0-9_+#-]*)\s*$/);
        if (fence) {
          flushBlocks();
          var closer = fence[1].charAt(0) === '`' ? /^\s*```/ : /^\s*~~~/;
          var lang = fence[2];
          var code = [];
          i++;
          while (i < lines.length && !closer.test(lines[i])) {
            code.push(lines[i]);
            i++;
          }
          html += '<pre class="md-pre">' +
            (lang ? '<span class="md-lang">' + escapeHtml(lang) + '</span>' : '') +
            '<code>' + escapeHtml(code.join('\n')) + '</code></pre>';
          continue;
        }

        // ── Blank line ends a paragraph or quote but leaves lists open ──
        if (!line) {
          flushPara();
          flushQuote();
          continue;
        }

        // ── GFM table ──
        if (line.indexOf('|') !== -1 && i + 1 < lines.length && isTableDivider(lines[i + 1])) {
          flushBlocks();
          var align = tableAlignments(lines[i + 1]);
          var head = splitTableRow(line);
          var rows = [];
          i += 2;
          while (i < lines.length && lines[i].trim() && lines[i].indexOf('|') !== -1) {
            rows.push(splitTableRow(lines[i]));
            i++;
          }
          i--;
          html += '<div class="md-table-wrap"><table class="md-table"><thead><tr>';
          for (var h = 0; h < head.length; h++) {
            html += '<th style="text-align:' + (align[h] || 'left') + '">' + renderInline(head[h]) + '</th>';
          }
          html += '</tr></thead><tbody>';
          for (var r = 0; r < rows.length; r++) {
            html += '<tr>';
            // Pad or trim ragged rows so the table never loses its shape.
            for (var c = 0; c < head.length; c++) {
              html += '<td style="text-align:' + (align[c] || 'left') + '">' + renderInline(rows[r][c] || '') + '</td>';
            }
            html += '</tr>';
          }
          html += '</tbody></table></div>';
          continue;
        }

        // ── Horizontal rule ──
        if (/^([-*_])\s*(\1\s*){2,}$/.test(line)) {
          flushBlocks();
          html += '<hr class="md-hr">';
          continue;
        }

        // ── ATX heading ──
        var atx = line.match(/^(#{1,6})\s+(.+?)\s*#*$/);
        if (atx) {
          flushBlocks();
          addHeading(atx[1].length, atx[2]);
          continue;
        }

        // ── A line that is nothing but bold text reads as a sub-heading ──
        var boldHead = line.match(/^\*\*([^*\n]{1,80})\*\*:?$/);
        if (boldHead) {
          flushBlocks();
          addHeading(3, boldHead[1]);
          continue;
        }

        // ── Blockquote ──
        var q = line.match(/^>\s?(.*)$/);
        if (q) {
          flushPara();
          closeAllLists();
          quote.push(q[1]);
          continue;
        }
        flushQuote();

        // ── List item (indent decides nesting; tabs count as four spaces) ──
        var indent = raw.replace(/\t/g, '    ').search(/\S/);
        if (indent < 0) indent = 0;
        var ul = line.match(/^[-*+•–]\s+(.*)$/);
        var ol = line.match(/^(\d{1,3})[.)]\s+(.*)$/);
        if (ul || ol) {
          flushPara();
          var type = ul ? 'ul' : 'ol';
          var itemText = ul ? ul[1] : ol[2];
          closeListsDeeperThan(indent + 1);
          var top = stack.length ? stack[stack.length - 1] : null;
          if (!top || indent >= top.indent + LIST_INDENT_STEP) {
            // Opening a nested list while the parent <li> is still open.
            stack.push({ type: type, indent: indent });
            html += '<' + type + ' class="md-list">';
          } else if (top.type !== type) {
            html += '</li></' + stack.pop().type + '>';
            stack.push({ type: type, indent: indent });
            html += '<' + type + ' class="md-list">';
          } else {
            html += '</li>';
          }
          html += '<li>' + renderInline(itemText);
          continue;
        }

        // ── Wrapped continuation of the list item above ──
        if (stack.length && indent >= stack[stack.length - 1].indent + LIST_INDENT_STEP) {
          html += ' ' + renderInline(line);
          continue;
        }

        // ── Ordinary paragraph text ──
        closeAllLists();
        para.push(line);
      }

      flushBlocks();
      return html;
    }

    // When a structured parse finds nothing, show the raw material rather than an
    // empty panel.
    function fallbackRender(content, note) {
      return '<div class="formatted-output md-body">' +
        '<p class="md-warn">' + escapeHtml(note) + '</p>' +
        renderMarkdown(content) + '</div>';
    }

    // ── Shared line patterns ──
    // Each tolerates the bold/italic markers models wrap labels in ("**Answer:** B").
    var RE_DIFFICULTY = /^[#*_\s]*(Easy|Medium|Hard)\b[^?]{0,30}$/i;
    var RE_QUESTION   = /^[*_\s]*(?:Q|Question|Problem)\s*(\d{1,3})\s*[.):]?\s*[*_]*\s*(.*)$/i;
    var RE_OPTION     = /^[*_\s]*\(?([A-D])[).:]\s*[*_]*\s*(.+)$/i;
    var RE_ANSWER     = /^[*_\s]*(?:Answer|Correct\s*Answer|Correct)[*_\s]*:[*_\s]*(.*)$/i;
    var RE_EXPLAIN    = /^[*_\s]*(?:Explanation|Reason|Why)[*_\s]*:[*_\s]*(.*)$/i;
    var RE_SOLUTION   = /^[*_\s]*(?:Solution|Working|Answer)[*_\s]*:[*_\s]*(.*)$/i;
    var RE_FRONT      = /^[*_\s]*(?:Front|Term|Q|Question)[*_\s]*:[*_\s]*(.*)$/i;
    var RE_BACK       = /^[*_\s]*(?:Back|Definition|A|Answer)[*_\s]*:[*_\s]*(.*)$/i;

    function readDifficulty(line) {
      var m = line.match(RE_DIFFICULTY);
      return m ? m[1].toLowerCase() : '';
    }

    // Answers arrive as "B", "(B)", "**B**", "B) Chlorophyll" or just the option
    // text. Anchoring at the start avoids matching a stray letter inside a word.
    function normalizeAnswer(ans, options) {
      var s = String(ans || '').replace(/[*_`]/g, '').trim();
      var m = s.match(/^\(?([A-D])\)?[.):]?(\s|$)/i);
      if (m) return m[1].toUpperCase();
      for (var i = 0; i < options.length; i++) {
        if (options[i].text && s && options[i].text.toLowerCase() === s.toLowerCase()) {
          return options[i].letter;
        }
      }
      return '';
    }

    function difficultyHeader(diff) {
      var label = diff.charAt(0).toUpperCase() + diff.slice(1);
      return '<div style="text-align: center; margin: 24px 0 16px 0;">' +
        '<span class="difficulty-badge ' + diff + '">' + label + '</span></div>';
    }

    // ──────────────────────────────
    //  FORMAT: NOTES
    // ──────────────────────────────
    function formatNotes(content) {
      var body = renderMarkdown(content, { badgeNumbers: true });
      if (!body) return fallbackRender(content, 'Could not format this response.');
      return '<div class="formatted-output md-body">' + body + '</div>';
    }

    // ──────────────────────────────
    //  FORMAT: SUMMARY
    // ──────────────────────────────
    function formatSummary(content) {
      var body = renderMarkdown(content, { badgeNumbers: true });
      if (!body) return fallbackRender(content, 'Could not format this response.');
      return '<div class="formatted-output md-body">' + body + '</div>';
    }

    // ──────────────────────────────
    //  FORMAT: MCQ (Interactive)
    // ──────────────────────────────
    function parseMCQ(content) {
      var lines = String(content || '').replace(/\r\n?/g, '\n').split('\n');
      var questions = [];
      var current = null;
      var difficulty = 'medium';
      var collecting = '';

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) { collecting = ''; continue; }

        var diff = readDifficulty(line);
        if (diff && !RE_OPTION.test(line)) {
          difficulty = diff;
          collecting = '';
          continue;
        }

        var qm = line.match(RE_QUESTION);
        if (qm) {
          if (current) questions.push(current);
          current = { q: qm[2].trim(), options: [], answer: '', explanation: '', difficulty: difficulty };
          collecting = 'q';
          continue;
        }
        if (!current) continue;

        var om = line.match(RE_OPTION);
        if (om) {
          current.options.push({ letter: om[1].toUpperCase(), text: om[2].trim() });
          collecting = 'option';
          continue;
        }

        var am = line.match(RE_ANSWER);
        if (am) {
          current.answer = am[1].trim();
          collecting = 'answer';
          continue;
        }

        var em = line.match(RE_EXPLAIN);
        if (em) {
          current.explanation = em[1].trim();
          collecting = 'explanation';
          continue;
        }

        // Wrapped continuation of whatever we were last reading.
        if (collecting === 'explanation') current.explanation += ' ' + line;
        else if (collecting === 'q') current.q += ' ' + line;
        else if (collecting === 'option' && current.options.length) {
          current.options[current.options.length - 1].text += ' ' + line;
        }
      }
      if (current) questions.push(current);

      for (var k = 0; k < questions.length; k++) {
        questions[k].answer = normalizeAnswer(questions[k].answer, questions[k].options);
      }
      return questions;
    }

    function formatMCQ(content) {
      mcqState = { total: 0, correct: 0, answered: 0, easyCorrect: 0, easyTotal: 0, medCorrect: 0, medTotal: 0, hardCorrect: 0, hardTotal: 0 };

      var questions = parseMCQ(content);
      if (!questions.length) {
        return fallbackRender(content, 'No questions could be read from this response — showing it as plain notes.');
      }

      var formatted = '<div class="formatted-output md-body">';
      formatted += '<h2 class="md-h">📝 Multiple Choice Quiz — Select Your Answers</h2>';

      // Only questions with a usable answer key are graded; the rest still render
      // rather than counting every click as wrong.
      questions.forEach(function(q) {
        q.gradable = !!q.answer && q.options.length >= 2;
        if (!q.gradable) return;
        mcqState.total++;
        if (q.difficulty === 'easy') mcqState.easyTotal++;
        else if (q.difficulty === 'medium') mcqState.medTotal++;
        else mcqState.hardTotal++;
      });

      var prevDifficulty = '';
      questions.forEach(function(qObj, idx) {
        if (qObj.difficulty !== prevDifficulty) {
          prevDifficulty = qObj.difficulty;
          formatted += difficultyHeader(qObj.difficulty);
        }
        formatted += buildInteractiveMCQ(qObj, idx);
      });

      formatted += '<div id="mcqGradePanel" class="grade-panel" style="display:none;"></div>';
      formatted += '</div>';
      return formatted;
    }

    function buildInteractiveMCQ(qObj, idx) {
      var qId = 'mcq_' + idx;
      var html = '<div id="' + qId + '_wrap" class="q-card">';
      html += '<p class="q-title">Q' + (idx + 1) + '. ' + renderInline(qObj.q) + '</p>';

      qObj.options.forEach(function(opt) {
        var attrs = ' data-qid="' + qId + '" data-letter="' + opt.letter +
          '" data-answer="' + escapeHtml(qObj.answer) +
          '" data-difficulty="' + qObj.difficulty + '"';
        var click = qObj.gradable ? ' onclick="handleMCQClick(this)"' : '';
        html += '<div class="mcq-option' + (qObj.gradable ? '' : ' mcq-inert') + '" id="' + qId + '_' + opt.letter + '"' + attrs + click + '>';
        html += '<div><span class="mcq-letter">' + opt.letter + ')</span><span>' + renderInline(opt.text) + '</span></div>';
        html += '<span class="mcq-icon"></span>';
        html += '</div>';
      });

      if (!qObj.gradable) {
        html += '<p class="md-warn">This question came back without a usable answer key, so it is not graded.</p>';
      }

      html += '<div class="mcq-feedback" id="' + qId + '_feedback"></div>';
      if (qObj.explanation) {
        html += '<div id="' + qId + '_explanation" class="mcq-explain" style="display:none;">ℹ️ ' +
          renderInline(qObj.explanation) + '</div>';
      }
      html += '</div>';
      return html;
    }

    window.handleMCQClick = function(el) {
      var qId = el.getAttribute('data-qid');
      var selectedLetter = el.getAttribute('data-letter');
      var correctLetter = el.getAttribute('data-answer');
      var difficulty = el.getAttribute('data-difficulty');
      if (!correctLetter) return;

      var allOpts = document.querySelectorAll('[data-qid="' + qId + '"]');
      if (allOpts[0].classList.contains('mcq-answered')) return;

      var isCorrect = selectedLetter === correctLetter;

      Array.prototype.forEach.call(allOpts, function(opt) {
        opt.classList.add('mcq-answered');
        var optLetter = opt.getAttribute('data-letter');
        if (optLetter === correctLetter) {
          opt.classList.add('mcq-correct');
          opt.querySelector('.mcq-icon').textContent = '✓';
        }
        if (optLetter === selectedLetter && !isCorrect) {
          opt.classList.add('mcq-wrong');
          opt.querySelector('.mcq-icon').textContent = '✗';
        }
        if (optLetter !== correctLetter && optLetter !== selectedLetter) {
          opt.style.opacity = '0.5';
        }
      });

      mcqState.answered++;
      if (isCorrect) {
        mcqState.correct++;
        if (difficulty === 'easy') mcqState.easyCorrect++;
        else if (difficulty === 'medium') mcqState.medCorrect++;
        else mcqState.hardCorrect++;
      }

      var feedback = document.getElementById(qId + '_feedback');
      feedback.classList.add('show');
      if (isCorrect) {
        feedback.classList.add('correct');
        feedback.innerHTML = '✓ Correct!';
      } else {
        feedback.classList.add('wrong');
        feedback.innerHTML = '✗ Wrong — the correct answer is <strong>' + escapeHtml(correctLetter) + '</strong>';
      }

      var expEl = document.getElementById(qId + '_explanation');
      if (expEl) expEl.style.display = 'block';

      var wrap = document.getElementById(qId + '_wrap');
      wrap.style.borderColor = isCorrect ? '#22c55e' : '#ef4444';

      if (mcqState.total > 0 && mcqState.answered >= mcqState.total) {
        setTimeout(showMCQGrade, 600);
      }
    };

    function showMCQGrade() {
      if (!mcqState.total) return;
      var pct = Math.round((mcqState.correct / mcqState.total) * 100);
      var grade, gradeColor;
      if (pct >= 90) { grade = 'A+'; gradeColor = '#22c55e'; }
      else if (pct >= 80) { grade = 'A'; gradeColor = '#22c55e'; }
      else if (pct >= 70) { grade = 'B'; gradeColor = '#3b82f6'; }
      else if (pct >= 60) { grade = 'C'; gradeColor = '#fbbf24'; }
      else if (pct >= 50) { grade = 'D'; gradeColor = '#f97316'; }
      else { grade = 'F'; gradeColor = '#ef4444'; }

      var panel = document.getElementById('mcqGradePanel');
      if (!panel) return;
      panel.style.display = 'block';
      panel.innerHTML = '<h2>🎓 Your Score</h2>' +
        '<div class="grade-circle" style="border-color: ' + gradeColor + '; color: ' + gradeColor + '; background: ' + gradeColor + '15;">' +
          '<span>' + grade + '</span>' +
          '<span class="grade-label">' + pct + '%</span>' +
        '</div>' +
        '<div class="grade-stats">' +
          '<div class="grade-stat"><div class="stat-value" style="color: #22c55e;">' + mcqState.correct + '</div><div class="stat-label">Correct</div></div>' +
          '<div class="grade-stat"><div class="stat-value" style="color: #ef4444;">' + (mcqState.total - mcqState.correct) + '</div><div class="stat-label">Wrong</div></div>' +
          '<div class="grade-stat"><div class="stat-value" style="color: #1d9bf0;">' + mcqState.total + '</div><div class="stat-label">Total</div></div>' +
        '</div>' +
        '<div class="grade-breakdown">' +
          '<div class="grade-breakdown-item"><div class="bd-label" style="color: #22c55e;">Easy</div><div class="bd-value" style="color: #e7e9ea;">' + mcqState.easyCorrect + ' / ' + mcqState.easyTotal + '</div></div>' +
          '<div class="grade-breakdown-item"><div class="bd-label" style="color: #fbbf24;">Medium</div><div class="bd-value" style="color: #e7e9ea;">' + mcqState.medCorrect + ' / ' + mcqState.medTotal + '</div></div>' +
          '<div class="grade-breakdown-item"><div class="bd-label" style="color: #ef4444;">Hard</div><div class="bd-value" style="color: #e7e9ea;">' + mcqState.hardCorrect + ' / ' + mcqState.hardTotal + '</div></div>' +
        '</div>';

      panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // ──────────────────────────────
    //  FORMAT: PRACTICE (solve & reveal)
    // ──────────────────────────────
    function parsePractice(content) {
      var lines = String(content || '').replace(/\r\n?/g, '\n').split('\n');
      var questions = [];
      var current = null;
      var difficulty = 'medium';

      for (var i = 0; i < lines.length; i++) {
        var raw = lines[i];
        var line = raw.trim();

        var diff = line ? readDifficulty(line) : '';
        if (diff) { difficulty = diff; continue; }

        var qm = line.match(RE_QUESTION);
        if (qm) {
          if (current) questions.push(current);
          current = { question: qm[2].trim(), solution: [], difficulty: difficulty, inSolution: false };
          continue;
        }
        if (!current) continue;

        // Anchored at the start of the line, so a question that merely contains
        // the word "answer" no longer splits early.
        var sm = line.match(RE_SOLUTION);
        if (sm && !current.inSolution) {
          current.inSolution = true;
          if (sm[1].trim()) current.solution.push(sm[1].trim());
          continue;
        }

        if (current.inSolution) {
          current.solution.push(raw);
        } else if (line) {
          current.question += ' ' + line;
        }
      }
      if (current) questions.push(current);
      return questions;
    }

    function formatPractice(content) {
      practiceState = { total: 0, revealed: 0, easyTotal: 0, medTotal: 0, hardTotal: 0 };

      var questions = parsePractice(content);
      if (!questions.length) {
        return fallbackRender(content, 'No practice questions could be read from this response — showing it as plain notes.');
      }

      var formatted = '<div class="formatted-output md-body">';
      formatted += '<h2 class="md-h">📝 Practice Questions — Solve &amp; Reveal</h2>';

      practiceState.total = questions.length;
      questions.forEach(function(q) {
        if (q.difficulty === 'easy') practiceState.easyTotal++;
        else if (q.difficulty === 'medium') practiceState.medTotal++;
        else practiceState.hardTotal++;
      });

      var prevDifficulty = '';
      questions.forEach(function(qObj, idx) {
        if (qObj.difficulty !== prevDifficulty) {
          prevDifficulty = qObj.difficulty;
          formatted += difficultyHeader(qObj.difficulty);
        }

        var pId = 'pq_' + idx;
        formatted += '<div class="q-card">';
        formatted += '<p class="q-title">📝 Q' + (idx + 1) + '.</p>';
        formatted += '<div class="q-body">' + renderMarkdown(qObj.question) + '</div>';
        formatted += '<button onclick="revealPracticeSolution(\'' + pId + '\')" id="' + pId + '_btn" class="reveal-btn">👁 Show Solution</button>';
        formatted += '<div id="' + pId + '_sol" class="sol-box" style="display:none;">';
        formatted += '<p class="sol-title">✓ Solution</p>';
        // Rendered as one markdown block so steps, formulas and tables survive.
        formatted += '<div class="md-body">' + renderMarkdown(qObj.solution.join('\n')) + '</div>';
        formatted += '</div></div>';
      });

      formatted += '<div id="practiceGradePanel" class="grade-panel" style="margin-top: 24px;">';
      formatted += '<h2>📊 Progress Tracker</h2>';
      formatted += '<p style="color: #71767b; margin: 8px 0;" id="practiceProgress">Solutions revealed: 0 / ' + practiceState.total + '</p>';
      formatted += '<div class="grade-breakdown">' +
        '<div class="grade-breakdown-item"><div class="bd-label" style="color: #22c55e;">Easy</div><div class="bd-value" style="color: #e7e9ea;">' + practiceState.easyTotal + ' Qs</div></div>' +
        '<div class="grade-breakdown-item"><div class="bd-label" style="color: #fbbf24;">Medium</div><div class="bd-value" style="color: #e7e9ea;">' + practiceState.medTotal + ' Qs</div></div>' +
        '<div class="grade-breakdown-item"><div class="bd-label" style="color: #ef4444;">Hard</div><div class="bd-value" style="color: #e7e9ea;">' + practiceState.hardTotal + ' Qs</div></div>' +
      '</div></div>';

      formatted += '</div>';
      return formatted;
    }

    window.revealPracticeSolution = function(pId) {
      var sol = document.getElementById(pId + '_sol');
      var btn = document.getElementById(pId + '_btn');
      var hidden = sol.style.display === 'none';
      sol.style.display = hidden ? 'block' : 'none';
      btn.textContent = hidden ? '🙈 Hide Solution' : '👁 Show Solution';
      btn.classList.toggle('revealed', hidden);
      practiceState.revealed += hidden ? 1 : -1;
      if (practiceState.revealed < 0) practiceState.revealed = 0;
      var progressEl = document.getElementById('practiceProgress');
      if (progressEl) {
        progressEl.textContent = 'Solutions revealed: ' + practiceState.revealed + ' / ' + practiceState.total;
      }
    };

    // ──────────────────────────────
    //  FORMAT: FLASHCARDS (click to flip)
    // ──────────────────────────────
    function parseFlashcards(content) {
      var lines = String(content || '').replace(/\r\n?/g, '\n').split('\n');
      var cards = [];
      var current = null;
      var side = '';

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;

        var fm = line.match(RE_FRONT);
        if (fm) {
          if (current && current.front && current.back) cards.push(current);
          current = { front: fm[1].trim(), back: '' };
          side = 'front';
          continue;
        }
        if (!current) continue;

        var bm = line.match(RE_BACK);
        if (bm) {
          current.back = bm[1].trim();
          side = 'back';
          continue;
        }

        if (side === 'back') current.back += ' ' + line;
        else current.front += ' ' + line;
      }
      if (current && current.front && current.back) cards.push(current);
      return cards;
    }

    function formatFlashcards(content) {
      var cards = parseFlashcards(content);
      if (!cards.length) {
        return fallbackRender(content, 'No flashcards could be read from this response — showing it as plain notes.');
      }

      var html = '<div class="formatted-output md-body">';
      html += '<h2 class="md-h">🃏 Flashcards — Click a Card to Flip</h2>';
      html += '<button class="reveal-btn" onclick="flipAllCards(this)" style="margin-bottom:14px;">🔄 Flip All</button>';
      html += '<div class="flip-grid">';
      cards.forEach(function(card, j) {
        html += '<div class="flip-card" onclick="this.classList.toggle(\'flipped\')">' +
          '<div class="flip-inner">' +
            '<div class="flip-face flip-front">' +
              '<div class="flip-tag">Card ' + (j + 1) + '</div>' +
              '<div class="flip-text">' + renderInline(card.front) + '</div>' +
              '<div class="flip-hint">click to flip</div>' +
            '</div>' +
            '<div class="flip-face flip-back">' +
              '<div class="flip-tag">Answer</div>' +
              '<div class="flip-text">' + renderInline(card.back) + '</div>' +
            '</div>' +
          '</div></div>';
      });
      html += '</div></div>';
      return html;
    }

    window.flipAllCards = function(btn) {
      var cards = document.querySelectorAll('.flip-card');
      var anyUnflipped = false;
      Array.prototype.forEach.call(cards, function(c) {
        if (!c.classList.contains('flipped')) anyUnflipped = true;
      });
      Array.prototype.forEach.call(cards, function(c) {
        c.classList.toggle('flipped', anyUnflipped);
      });
      btn.textContent = anyUnflipped ? '🔄 Show Fronts' : '🔄 Flip All';
    };

    // ──────────────────────────────
    //  FORMAT: MINDMAP
    // ──────────────────────────────
    function formatMindmap(content) {
      var tree = buildMindmapTree(String(content || '').replace(/\r\n?/g, '\n').split('\n'));
      if (!tree.children.length) {
        return fallbackRender(content, 'No mind map structure could be read from this response — showing it as plain notes.');
      }
      return '<div class="formatted-output mindmap-body">' + renderMindmapTree(tree) + '</div>';
    }

    function buildMindmapTree(lines) {
      var items = [];
      lines.forEach(function(raw) {
        var expanded = raw.replace(/\t/g, '    ');
        var indent = expanded.search(/\S/);
        if (indent < 0) return;
        var text = expanded.trim().replace(/^[-*+•–]\s*/, '').replace(/^#{1,6}\s*/, '').trim();
        if (!text) return;
        items.push({ indent: indent, text: text });
      });

      // Map the indent widths that actually appear onto sequential levels, so
      // 2-, 3- or 4-space indentation all produce the same tree.
      var widths = [];
      items.forEach(function(it) {
        if (widths.indexOf(it.indent) === -1) widths.push(it.indent);
      });
      widths.sort(function(a, b) { return a - b; });

      var tree = { level: -1, text: 'root', children: [], id: 'root' };
      var stack = [tree];
      var nodeId = 0;
      items.forEach(function(it) {
        var level = widths.indexOf(it.indent);
        var node = { level: level, text: it.text, children: [], id: 'node' + (nodeId++) };
        while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
        stack[stack.length - 1].children.push(node);
        stack.push(node);
      });
      return tree;
    }

    function renderMindmapTree(node, isRoot) {
      if (isRoot === undefined) isRoot = true;
      var colors = ['#1d9bf0', '#71ebf5', '#a8e6a1', '#ff9ab3', '#ffc857', '#ff6b9d'];
      var color = colors[node.level + 1] || colors[colors.length - 1];

      if (isRoot && node.level === -1) {
        var rootHtml = '<div>';
        node.children.forEach(function(child) {
          rootHtml += renderMindmapTree(child, false);
        });
        return rootHtml + '</div>';
      }

      var hasChildren = node.children && node.children.length > 0;
      var text = renderInline(node.text);
      var size = [1.3, 1.1, 0.95, 0.85, 0.75][Math.min(node.level + 1, 4)];
      var weight = node.level === 0 ? 700 : node.level === 1 ? 600 : node.level === 2 ? 500 : 400;
      var rgb = hexToRgba(color);
      // The top two levels start open, so the map is readable without clicking.
      var open = node.level < 2;

      var html = '<div style="margin: 8px 0; margin-left: ' + ((node.level + 1) * 22) + 'px;">';
      if (hasChildren) {
        html += '<div class="mm-node" style="background: linear-gradient(135deg, rgba(' + rgb + ', 0.2) 0%, rgba(' + rgb + ', 0.05) 100%); border-left: 4px solid ' + color + '; font-size: ' + size + 'rem; font-weight: ' + weight + '; color: ' + color + ';" onclick="toggleMindmapBranch(this)">';
        html += '<span class="mm-arrow"' + (open ? ' style="transform: rotate(90deg);"' : '') + '>▶</span>';
        html += '<span>' + text + '</span></div>';
        html += '<div class="mindmap-branch" style="display: ' + (open ? 'block' : 'none') + ';">';
        node.children.forEach(function(child) {
          html += renderMindmapTree(child, false);
        });
        html += '</div>';
      } else {
        html += '<div class="mm-leaf" style="background: rgba(' + rgb + ', 0.1); border-left: 3px solid ' + color + '; font-size: ' + size + 'rem; font-weight: ' + weight + '; color: ' + color + ';">' + text + '</div>';
      }
      return html + '</div>';
    }

    function hexToRgba(hex) {
      var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? parseInt(result[1], 16) + ',' + parseInt(result[2], 16) + ',' + parseInt(result[3], 16) : '29,155,240';
    }

    window.toggleMindmapBranch = function(element) {
      var branch = element.nextElementSibling;
      var arrow = element.querySelector('.mm-arrow');
      if (branch && branch.classList.contains('mindmap-branch')) {
        var hidden = branch.style.display === 'none';
        branch.style.display = hidden ? 'block' : 'none';
        arrow.style.transform = hidden ? 'rotate(90deg)' : 'rotate(0deg)';
      }
    };

    // ──────────────────────────────
    //  FORMAT DISPATCHER
    // ──────────────────────────────
    function formatContent(type, content) {
      try {
        switch (type) {
          case 'notes': return formatNotes(content);
          case 'mcq': return formatMCQ(content);
          case 'practice': return formatPractice(content);
          case 'flashcards': return formatFlashcards(content);
          case 'summary': return formatSummary(content);
          case 'mindmap': return formatMindmap(content);
          default: return '<div class="formatted-output md-body">' + renderMarkdown(content) + '</div>';
        }
      } catch (e) {
        // A formatting failure should never cost the user their generated material.
        return fallbackRender(content, 'Formatting failed (' + e.message + ') — showing the raw response.');
      }
    }

    async function generate() {
      var topic = document.getElementById('topic').value.trim();
      if (!topic) {
        showToast('⚠️ Please enter a topic');
        return;
      }
      var provider = document.getElementById('apiProvider').value;
      var key = cleanKey(document.getElementById('apiKey').value);
      if (!key) {
        showToast('⚠️ Please paste your API key');
        return;
      }
      var shapeWarning = checkKeyShape(provider, key);
      if (shapeWarning) {
        showToast(shapeWarning);
        return;
      }
      saveKey(provider, key);
      var subject = document.getElementById('subject').value;
      var grade = document.getElementById('grade').value;
      var loader = document.getElementById('loader');
      loader.style.display = 'flex';
      updateLoaderMsg('Generating material...');
      try {
        var prompt = getPrompt(contentType, topic, subject, grade);
        var result = await callAPI(provider, key, prompt);
        historyData.push({
          topic: topic,
          type: contentType,
          content: result
        });
        currentHistIdx = historyData.length - 1;
        showResult(result, contentType);
        renderHistory();
        showToast('✨ Material generated successfully!');
      } catch (e) {
        showErrorModal(e.message, provider);
      } finally {
        loader.style.display = 'none';
        updateLoaderMsg('Generating material...');
      }
    }

    function showErrorModal(message, provider) {
      // Remove existing modal if any
      var existing = document.getElementById('errorModal');
      if (existing) existing.remove();

      var tips = '';
      if (message.indexOf('no longer available') !== -1) {
        tips = '<p style="color: #fbbf24; margin-top: 10px;">💡 <strong>Tip:</strong> This is a model problem, not a key problem. The provider retired the model this app asks for — edit the <code>MODELS</code> object near the top of the script and pick a current model ID.</p>';
      } else if (message.indexOf('tokens per minute') !== -1 || message.indexOf('rate') !== -1 || message.indexOf('429') !== -1) {
        tips = '<p style="color: #fbbf24; margin-top: 10px;">💡 <strong>Tip:</strong> Groq free tier has a low token limit. Wait 60 seconds and try again, or switch to <strong>Gemini</strong> which has a much more generous free tier.</p>';
      } else if (message.indexOf('401') !== -1 || message.indexOf('403') !== -1 || message.indexOf('Invalid or unauthorized') !== -1 || message.indexOf('Incorrect') !== -1) {
        tips = '<p style="color: #fbbf24; margin-top: 10px;">💡 <strong>Tip:</strong> Your API key appears to be invalid. Double-check that you copied the full key from your ' + provider + ' dashboard.</p>';
      } else if (message.indexOf('Network') !== -1 || message.indexOf('fetch') !== -1) {
        tips = '<p style="color: #fbbf24; margin-top: 10px;">💡 <strong>Tip:</strong> Check your internet connection and try again.</p>';
      }

      var modal = document.createElement('div');
      modal.id = 'errorModal';
      modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,20,25,0.9);display:flex;justify-content:center;align-items:center;z-index:1002;backdrop-filter:blur(6px);';
      modal.innerHTML = '<div style="background:linear-gradient(135deg,#16181c,#1a1f2e);border:2px solid #ef4444;border-radius:16px;padding:28px;max-width:500px;width:90%;box-shadow:0 8px 32px rgba(239,68,68,0.2);">' +
        '<h3 style="color:#ef4444;margin-bottom:14px;font-size:1.2rem;">⚠️ API Error</h3>' +
        '<p style="color:#bab9b4;line-height:1.6;font-size:0.9rem;word-break:break-word;">' + message + '</p>' +
        tips +
        '<div style="display:flex;gap:10px;margin-top:20px;">' +
          '<button onclick="document.getElementById(\'errorModal\').remove(); generate();" style="flex:1;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#1d9bf0,#1a8cd8);color:#fff;font-weight:600;cursor:pointer;transition:all 0.3s;">🔄 Retry</button>' +
          '<button onclick="document.getElementById(\'errorModal\').remove()" style="flex:1;padding:12px;border-radius:10px;border:1px solid #2f3336;background:#0f1419;color:#71767b;font-weight:500;cursor:pointer;transition:all 0.3s;">Dismiss</button>' +
        '</div>' +
      '</div>';
      document.body.appendChild(modal);
    }

    function showResult(content, type) {
      var resultCard = document.getElementById('resultCard');
      var outputDiv = document.getElementById('outputContent');

      // Store raw content
      outputDiv.style.display = 'none';
      outputDiv.textContent = content;

      // The container already exists in the markup; the old code appended a
      // second element carrying the same id on the first render.
      var target = document.getElementById('formattedOutput');
      target.innerHTML = formatContent(type, content);
      target.scrollTop = 0;
      resultCard.style.display = 'block';
      renderHistTabs();
    }

    function renderHistTabs() {
      var tabs = document.getElementById('histTabs');
      tabs.innerHTML = '';
      for (var i = 0; i < historyData.length; i++) {
        var h = historyData[i];
        var t = document.createElement('div');
        t.className = 'hist-tab' + (i === currentHistIdx ? ' active' : '');
        t.textContent = h.topic + ' (' + h.type + ')';
        t.onclick = (function(idx) {
          return function() {
            currentHistIdx = idx;
            showResult(historyData[idx].content, historyData[idx].type);
          };
        })(i);
        tabs.appendChild(t);
      }
    }

    function renderHistory() {
      var list = document.getElementById('historyList');
      list.innerHTML = '';
      for (var i = historyData.length - 1; i >= 0; i--) {
        var h = historyData[i];
        var item = document.createElement('div');
        item.className = 'hist-item';
        item.innerHTML = '<span>📚 ' + h.topic + ' - <strong>' + h.type + '</strong></span><span class="del-btn" onclick="delHistory(' + i + ', event)">×</span>';
        item.onclick = function(idx) {
          return function(e) {
            if (e.target.classList.contains('del-btn')) return;
            currentHistIdx = idx;
            showResult(historyData[idx].content, historyData[idx].type);
            document.getElementById('resultCard').style.display = 'block';
            renderHistTabs();
          };
        }(i);
        list.appendChild(item);
      }
    }

    function delHistory(idx, event) {
      event.stopPropagation();
      historyData.splice(idx, 1);
      if (currentHistIdx >= historyData.length) currentHistIdx = historyData.length - 1;
      if (historyData.length === 0) {
        document.getElementById('historyCard').style.display = 'none';
        document.getElementById('resultCard').style.display = 'none';
      } else {
        showResult(historyData[currentHistIdx].content, historyData[currentHistIdx].type);
      }
      renderHistory();
      renderHistTabs();
    }

    function copyOutput() {
      var text = document.getElementById('outputContent').textContent;
      navigator.clipboard.writeText(text).then(function() {
        showToast('✓ Copied to clipboard!');
      }).catch(function() {
        alert('Failed to copy');
      });
    }

    function downloadOutput() {
      var text = document.getElementById('outputContent').textContent;
      var blob = new Blob([text], {
        type: 'text/markdown'
      });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'StudyForAll-' + contentType + '-' + new Date().toISOString().slice(0, 10) + '.md';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('⬇️ Downloaded successfully!');
    }
  </script>
</body>
