<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyForge - AI Study Material Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
      color: #e7e9ea;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(29, 155, 240, 0.2);
    }

    .header h1 {
      font-size: 3rem;
      color: #fff;
      margin-bottom: 8px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .header p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.1rem;
    }

    .card {
      background: linear-gradient(135deg, #16181c 0%, #1a1f2e 100%);
      border: 1px solid #2f3336;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .card:hover {
      border-color: #1d9bf0;
      box-shadow: 0 8px 24px rgba(29, 155, 240, 0.15);
    }

    .api-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .api-select,
    .dropdown,
    .topic-input,
    .api-key-input {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #2f3336;
      background: #0f1419;
      color: #fff;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .api-select:focus,
    .dropdown:focus,
    .topic-input:focus,
    .api-key-input:focus {
      outline: none;
      border-color: #1d9bf0;
      box-shadow: 0 0 0 3px rgba(29, 155, 240, 0.1);
      background: #16181c;
    }

    .api-key-input {
      flex: 1;
      min-width: 200px;
    }

    .api-select {
      min-width: 160px;
      cursor: pointer;
    }

    .dropdown {
      flex: 1;
      min-width: 140px;
      cursor: pointer;
    }

    .topic-input {
      width: 100%;
      margin-bottom: 12px;
    }

    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .get-key-link {
      color: #fff;
      background: rgba(29, 155, 240, 0.2);
      border: 1px solid #1d9bf0;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      white-space: nowrap;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .get-key-link:hover {
      background: #1d9bf0;
      color: #fff;
      box-shadow: 0 4px 12px rgba(29, 155, 240, 0.3);
    }

    .type-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }

    .type-btn {
      padding: 12px 20px;
      border-radius: 24px;
      border: 2px solid #2f3336;
      background: #0f1419;
      color: #71767b;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .type-btn:hover {
      border-color: #1d9bf0;
      color: #1d9bf0;
      background: rgba(29, 155, 240, 0.05);
    }

    .type-btn.active {
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      color: #fff;
      border-color: #1d9bf0;
      box-shadow: 0 4px 12px rgba(29, 155, 240, 0.3);
    }

    .generate-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(29, 155, 240, 0.2);
    }

    .generate-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(29, 155, 240, 0.4);
    }

    .generate-btn:disabled {
      background: #2f3336;
      color: #71767b;
      cursor: not-allowed;
      box-shadow: none;
    }

    .hist-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .hist-tab {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #2f3336;
      background: #0f1419;
      color: #71767b;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.3s ease;
    }

    .hist-tab:hover {
      border-color: #1d9bf0;
      color: #1d9bf0;
      background: rgba(29, 155, 240, 0.05);
    }

    .hist-tab.active {
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      color: #fff;
      border-color: #1d9bf0;
      box-shadow: 0 4px 12px rgba(29, 155, 240, 0.2);
    }

    .out-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .action-btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid #1d9bf0;
      background: rgba(29, 155, 240, 0.1);
      color: #1d9bf0;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .action-btn:hover {
      background: #1d9bf0;
      color: #fff;
      box-shadow: 0 4px 12px rgba(29, 155, 240, 0.3);
    }

    .output-content {
      background: #0f1419;
      border: 1px solid #2f3336;
      border-radius: 12px;
      padding: 20px;
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      line-height: 1.8;
      color: #e7e9ea;
      max-height: 500px;
      overflow-y: auto;
      word-wrap: break-word;
    }

    /* Enhanced output formatting */
    .formatted-output {
      background: #0f1419;
      border: 1px solid #2f3336;
      border-radius: 12px;
      padding: 24px;
      max-height: 500px;
      overflow-y: auto;
    }

    .formatted-output h2 {
      color: #1d9bf0;
      font-size: 1.4rem;
      margin: 20px 0 16px 0;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(29, 155, 240, 0.3);
    }

    .formatted-output h3 {
      color: #71ebf5;
      font-size: 1.1rem;
      margin: 16px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .formatted-output h4 {
      color: #e7e9ea;
      font-size: 0.95rem;
      margin: 12px 0 8px 0;
      font-weight: 600;
    }

    .formatted-output p {
      margin: 8px 0;
      line-height: 1.7;
      color: #bab9b4;
    }

    .formatted-output li {
      margin: 6px 0 6px 20px;
      color: #bab9b4;
      line-height: 1.6;
    }

    .formatted-output ul, .formatted-output ol {
      margin: 10px 0;
    }

    .question-block {
      background: linear-gradient(135deg, rgba(29, 155, 240, 0.1) 0%, rgba(26, 140, 216, 0.05) 100%);
      border-left: 4px solid #1d9bf0;
      padding: 16px;
      margin: 12px 0;
      border-radius: 8px;
    }

    .question-block strong {
      color: #71ebf5;
    }

    .answer-block {
      background: rgba(67, 122, 34, 0.1);
      border-left: 4px solid #437a22;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      color: #bab9b4;
      font-size: 0.9rem;
    }

    .concept-box {
      background: linear-gradient(135deg, rgba(113, 235, 245, 0.1) 0%, rgba(29, 155, 240, 0.05) 100%);
      border: 1px solid rgba(113, 235, 245, 0.3);
      padding: 14px;
      margin: 10px 0;
      border-radius: 8px;
      border-left: 4px solid #71ebf5;
    }

    .formula-box {
      background: rgba(249, 24, 128, 0.08);
      border: 1px solid rgba(249, 24, 128, 0.2);
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      color: #ff9ab3;
      text-align: center;
    }

    .flashcard {
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      border-radius: 12px;
      padding: 20px;
      margin: 12px 0;
      color: #fff;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 4px 16px rgba(29, 155, 240, 0.2);
    }

    .flashcard.back {
      background: linear-gradient(135deg, rgba(113, 235, 245, 0.2) 0%, rgba(29, 155, 240, 0.1) 100%);
      color: #71ebf5;
      border: 1px solid #71ebf5;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 0 12px 0;
      padding-bottom: 8px;
      border-bottom: 2px solid rgba(29, 155, 240, 0.3);
    }

    .section-icon {
      font-size: 1.3rem;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 250px;
      overflow-y: auto;
    }

    .hist-item {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #2f3336;
      background: linear-gradient(135deg, #16181c 0%, #1a1f2e 100%);
      color: #e7e9ea;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }

    .hist-item:hover {
      border-color: #1d9bf0;
      background: linear-gradient(135deg, rgba(29, 155, 240, 0.1) 0%, rgba(29, 155, 240, 0.05) 100%);
      transform: translateX(4px);
    }

    .hist-item .del-btn {
      color: #f91880;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      transition: all 0.3s ease;
    }

    .hist-item .del-btn:hover {
      color: #ff4d4d;
      transform: scale(1.2);
    }

    .history-tabs {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .tab-label {
      color: #71767b;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .loader {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 20, 25, 0.95);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #2f3336;
      border-top-color: #1d9bf0;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 20px rgba(29, 155, 240, 0.3);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader p {
      margin-top: 20px;
      color: #71767b;
      font-size: 1.1rem;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      color: #fff;
      padding: 14px 28px;
      border-radius: 10px;
      opacity: 0;
      transition: opacity 0.3s;
      font-size: 0.9rem;
      z-index: 1001;
      box-shadow: 0 4px 16px rgba(29, 155, 240, 0.3);
      font-weight: 500;
    }

    .toast.show {
      opacity: 1;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0f1419;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: #2f3336;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #1d9bf0;
    }

    .card h3 {
      color: #71ebf5;
      font-size: 1.2rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>StudyForge</h1>
    <p>AI-Powered Study Material Generator</p>
  </div>

  <div class="card api-card">
    <div class="api-row">
      <select id="apiProvider" class="api-select">
        <option value="groq">Groq (Free)</option>
        <option value="gemini">Gemini (Google)</option>
        <option value="openai">OpenAI</option>
      </select>
      <input type="password" id="apiKey" class="api-key-input" placeholder="Paste your API key">
      <a href="javascript:void(0)" class="get-key-link" onclick="showProviderLink()">Get key here</a>
    </div>
  </div>

  <div class="card form-card">
    <div class="form-row">
      <input type="text" id="topic" class="topic-input" placeholder="Enter topic (e.g., Photosynthesis)">
    </div>
    <div class="form-row">
      <select id="subject" class="dropdown">
        <option value="Science">Science</option>
        <option value="Maths">Maths</option>
        <option value="History">History</option>
        <option value="English">English</option>
        <option value="Physics">Physics</option>
        <option value="Chemistry">Chemistry</option>
        <option value="Biology">Biology</option>
        <option value="Geography">Geography</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Economics">Economics</option>
      </select>
      <select id="grade" class="dropdown">
        <option value="6">Grade 6</option>
        <option value="7">Grade 7</option>
        <option value="8">Grade 8</option>
        <option value="9">Grade 9</option>
        <option value="10">Grade 10</option>
        <option value="11">Grade 11</option>
        <option value="12">Grade 12</option>
        <option value="UG">Undergraduate</option>
      </select>
    </div>
  </div>

  <div class="card types-card">
    <h3>Content Type</h3>
    <div class="type-btns">
      <button class="type-btn active" data-type="notes" onclick="setType('notes')">Study Notes</button>
      <button class="type-btn" data-type="mcq" onclick="setType('mcq')">MCQs</button>
      <button class="type-btn" data-type="practice" onclick="setType('practice')">Practice</button>
      <button class="type-btn" data-type="flashcards" onclick="setType('flashcards')">Flashcards</button>
      <button class="type-btn" data-type="summary" onclick="setType('summary')">Summary</button>
      <button class="type-btn" data-type="mindmap" onclick="setType('mindmap')">Mind Map</button>
    </div>
    <button class="generate-btn" onclick="generate()">Generate Material</button>
  </div>

  <div class="card" id="historyCard" style="display:none">
    <h3>History</h3>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="card result-card" id="resultCard" style="display:none">
    <div class="history-tabs">
      <span class="tab-label">📋 Your Generations:</span>
      <div class="hist-tabs" id="histTabs"></div>
    </div>
    <div class="out-actions">
      <button class="action-btn" onclick="copyOutput()">📋 Copy</button>
      <button class="action-btn" onclick="downloadOutput()">⬇️ Download</button>
    </div>
    <div id="formattedOutput"></div>
    <pre class="output-content" id="outputContent" style="display:none;"></pre>
  </div>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <p>Generating material...</p>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var contentType = 'notes';
    var historyData = [];
    var currentHistIdx = 0;

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() {
        t.classList.remove('show');
      }, 2500);
    }

    function showProviderLink() {
      var p = document.getElementById('apiProvider').value;
      var links = {
        groq: 'https://console.groq.com/keys',
        gemini: 'https://aistudio.google.com/app/apikey',
        openai: 'https://platform.openai.com/api-keys'
      };
      window.open(links[p], '_blank');
    }

    function setType(t) {
      contentType = t;
      var btns = document.querySelectorAll('.type-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('active');
      }
      document.querySelector('[data-type="' + t + '"]').classList.add('active');
    }

    function getPrompt(type, topic, subject, grade) {
      var gradeLabel = grade === 'UG' ? 'Undergraduate' : 'Grade ' + grade;
      var detailLevel = grade === 'UG' ? 'comprehensive university-level' : 'detailed';
      var syllabusNote = grade === 'UG' ? 'Cover all major concepts from standard university curriculum.' : 'Cover all major concepts from the syllabus.';
      
      var prompts = {
        notes: 'Create ' + detailLevel + ' study notes for ' + gradeLabel + ' ' + subject + ' on "' + topic + '". ' + syllabusNote + ' Structure: 1) Introduction & Definition, 2) Historical Context, 3) Key Concepts (with detailed explanations), 4) Detailed Explanation (with examples), 5) Important Formulas/Rules/Laws, 6) Applications & Real-world Examples, 7) Common Misconceptions & Mistakes, 8) Advanced Topics (if applicable), 9) Summary Box. Make it comprehensive with clear formatting using headers and sub-headers.',
        mcq: 'Generate 10 challenging MCQs for ' + gradeLabel + ' ' + subject + ' on "' + topic + '". Format each question exactly like this:\n\nQ1. [Question]\nA) [Option]\nB) [Option]\nC) [Option]\nD) [Option]\nAnswer: [Letter]\nExplanation: [Brief explanation]',
        practice: 'Create practice problems for ' + gradeLabel + ' ' + subject + ' on "' + topic + '". 3 Easy (with solution), 3 Medium (with solution), 2 Hard (with solution). Show step-by-step working clearly.',
        flashcards: 'Create exactly 15 flashcards for ' + gradeLabel + ' ' + subject + ' on "' + topic + '". Format EACH card on separate lines like this:\nFront: [Question]\nBack: [Answer]\n\nRepeat this format for all 15 cards. Do not mix questions together.',
        summary: 'Create a revision summary for ' + gradeLabel + ' ' + subject + ' on "' + topic + '". Include: Must-Know Concepts, Quick Facts, Common Exam Questions, Mnemonics, Key Formulas.',
        mindmap: 'Create a structured mind map for "' + topic + '" suitable for ' + gradeLabel + ' ' + subject + '. Format exactly like:\n\n' + topic + '\n  - Main Branch 1\n    - Sub-topic 1.1\n      - Point 1.1.1\n      - Point 1.1.2\n    - Sub-topic 1.2\n      - Point 1.2.1\n  - Main Branch 2\n    - Sub-topic 2.1\n      - Point 2.1.1\n\nUse consistent indentation with 2 spaces per level. Each branch should have 2-3 sub-topics with 2-3 points each.'
      };
      return prompts[type];
    }

    async function callAPI(provider, key, prompt) {
      if (provider === 'groq') {
        var res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + key
          },
          body: JSON.stringify({
            model: 'llama-3.1-8b-instant',
            messages: [{
              role: 'user',
              content: prompt
            }],
            max_tokens: 2048
          })
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error ? data.error.message : 'Groq error');
        return data.choices[0].message.content;
      } else if (provider === 'gemini') {
        var res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + key, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: prompt
              }]
            }],
            generationConfig: {
              maxOutputTokens: 2048
            }
          })
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error ? data.error.message : 'Gemini error');
        return data.candidates[0].content.parts[0].text;
      } else if (provider === 'openai') {
        var res = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + key
          },
          body: JSON.stringify({
            model: 'gpt-3.5-turbo',
            messages: [{
              role: 'user',
              content: prompt
            }],
            max_tokens: 2048
          })
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error ? data.error.message : 'OpenAI error');
        return data.choices[0].message.content;
      }
    }

    function escapeHtml(text) {
      var map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    function parseMarkdown(text) {
      // Bold with **text**
      text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      // Bold with __text__
      text = text.replace(/__(.*?)__/g, '<strong>$1</strong>');
      // Italic with *text* (but not **)
      text = text.replace(/(?<!\*)\*([^\*]+)\*(?!\*)/g, '<em>$1</em>');
      // Italic with _text_ (but not __)
      text = text.replace(/(?<!_)_([^_]+)_(?!_)/g, '<em>$1</em>');
      // Code with `text`
      text = text.replace(/`([^`]+)`/g, '<code style="background: rgba(29, 155, 240, 0.2); padding: 2px 6px; border-radius: 4px; color: #71ebf5;">$1</code>');
      return text;
    }

    function extractKeywords(content, topic) {
      var words = content.toLowerCase().split(/\s+/);
      var keywordCount = {};
      var stopWords = ['the', 'a', 'an', 'and', 'or', 'but', 'in', 'on', 'at', 'to', 'for', 'of', 'is', 'are', 'was', 'were', 'be', 'been', 'that', 'this', 'which', 'who', 'what', 'when', 'where', 'why', 'how', 'if', 'as', 'by', 'with', 'from', 'into', 'during', 'before', 'after', 'above', 'below', 'up', 'down', 'out', 'off', 'over', 'under', 'again', 'further', 'then', 'once', 'etc', 'also', 'can', 'has', 'have', 'it', 'its', 'these', 'those', 'i', 'you', 'he', 'she', 'we', 'they', 'him', 'her', 'us', 'them', 'more', 'most', 'some', 'any', 'all', 'each', 'every', 'both', 'just', 'only', 'very', 'so', 'too', 'should', 'would', 'could', 'must', 'may', 'might', 'will', 'shall', 'do', 'does', 'did'];
      
      words.forEach(function(word) {
        word = word.replace(/[.,!?;:()\-]/g, '').trim();
        if (word.length > 4 && stopWords.indexOf(word) === -1 && !word.match(/^\d+$/)) {
          keywordCount[word] = (keywordCount[word] || 0) + 1;
        }
      });
      
      var topKeywords = Object.keys(keywordCount).sort(function(a, b) {
        return keywordCount[b] - keywordCount[a];
      }).slice(0, 6);
      
      return topKeywords;
    }

    function highlightKeywords(text, keywords) {
      if (!keywords || keywords.length === 0) return text;
      keywords.forEach(function(keyword) {
        if (keyword.length > 3) {
          var regex = new RegExp('\\b(' + keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')\\b', 'gi');
          text = text.replace(regex, '<span style="background: rgba(249, 24, 128, 0.3); padding: 2px 4px; border-radius: 3px; font-weight: 600; color: #ff9ab3;">$1</span>');
        }
      });
      return text;
    }

    function formatNotes(content) {
      var formatted = '<div class="formatted-output">';
      var lines = content.split('\n');
      var inList = false;
      var keywords = extractKeywords(content, '');
      var sectionCount = 0;  // Track main sections
      
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) {
          if (inList) {
            formatted += '</ul>';
            inList = false;
          }
          formatted += '<div style="height: 8px;"></div>';
          continue;
        }

        // Headings with #
        if (line.match(/^#{1,6}\s/)) {
          if (inList) {
            formatted += '</ul>';
            inList = false;
          }
          var level = line.match(/^#+/)[0].length;
          var text = line.replace(/^#+\s/, '').trim();
          text = parseMarkdown(text);
          text = highlightKeywords(text, keywords);
          formatted += '<h' + (level + 1) + ' style="color: #1d9bf0; margin: 20px 0 12px 0; border-bottom: 2px solid rgba(29, 155, 240, 0.3); padding-bottom: 8px;">' + text + '</h' + (level + 1) + '>';
        }
        // Main numbered sections like "1. Key Concepts" or "4. Detailed Explanation" (1-9 only at start)
        else if (line.match(/^[1-9]\.\s/) && !line.match(/^[1-9]\.\s+.*[-–•*]/)) {
          // Check if this is actually a main section (by looking for main section keywords)
          var isMainSection = line.match(/^[1-9]\.\s+(Introduction|Historical|Key Concepts|Detailed|Important|Applications|Common|Advanced|Summary|Additional)/i);
          
          if (isMainSection) {
            if (inList) {
              formatted += '</ul>';
              inList = false;
            }
            sectionCount++;
            var sectionText = line.replace(/^[1-9]\.\s/, '').trim();
            sectionText = parseMarkdown(sectionText);
            sectionText = highlightKeywords(sectionText, keywords);
            formatted += '<h3 style="color: #71ebf5; margin: 18px 0 12px 0; font-size: 1.1rem; display: flex; align-items: center; gap: 8px;"><span style="color: #1d9bf0; background: rgba(29, 155, 240, 0.2); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem;">' + line.match(/^[1-9]/)[0] + '</span>' + sectionText + '</h3>';
          } else {
            // Treat as bullet point if not a main section
            if (!inList) {
              formatted += '<ul style="margin: 10px 0 10px 20px; list-style: none;">';
              inList = true;
            }
            var itemText = line.replace(/^\d+\.\s/, '').trim();
            itemText = parseMarkdown(itemText);
            itemText = highlightKeywords(itemText, keywords);
            formatted += '<li style="margin: 8px 0; padding-left: 20px; position: relative; line-height: 1.7;"><span style="position: absolute; left: 0; color: #1d9bf0;">▸</span>' + itemText + '</li>';
          }
        }
        // Sub-items with dashes or bullets
        else if (line.match(/^[-–•*]\s/) || line.match(/^\s+[-–•*]\s/)) {
          if (!inList) {
            formatted += '<ul style="margin: 10px 0 10px 20px; list-style: none;">';
            inList = true;
          }
          var itemText = line.replace(/^\s*[-–•*]\s/, '').trim();
          itemText = parseMarkdown(itemText);
          itemText = highlightKeywords(itemText, keywords);
          formatted += '<li style="margin: 8px 0; padding-left: 20px; position: relative; line-height: 1.7;"><span style="position: absolute; left: 0; color: #1d9bf0;">▸</span>' + itemText + '</li>';
        }
        // Definition lines
        else if (line.match(/^[A-Z].*:/) || line.match(/^\*\*[^*]+\*\*:/)) {
          var defText = parseMarkdown(line);
          defText = highlightKeywords(defText, keywords);
          formatted += '<p style="margin: 10px 0; padding: 8px; background: rgba(113, 235, 245, 0.05); border-left: 3px solid #71ebf5; border-radius: 4px;">' + defText + '</p>';
        }
        else {
          if (inList) {
            formatted += '</ul>';
            inList = false;
          }
          var pText = parseMarkdown(line);
          pText = highlightKeywords(pText, keywords);
          formatted += '<p style="margin: 10px 0; line-height: 1.8; color: #bab9b4;">' + pText + '</p>';
        }
      }
      
      if (inList) {
        formatted += '</ul>';
      }
      formatted += '</div>';
      return formatted;
    }

    function formatMCQ(content) {
      var formatted = '<div class="formatted-output">';
      var lines = content.split('\n');
      var questions = [];
      var currentQ = null;
      
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        
        if (line.match(/^Q\d+\.|^Question\s+\d+/i)) {
          if (currentQ) questions.push(currentQ);
          currentQ = { q: line.replace(/^Q\d+\.\s?|^Question\s+\d+\.\s?/i, ''), options: [], answer: '', explanation: '' };
        } else if (currentQ && line.match(/^[A-D]\)\s/)) {
          currentQ.options.push(line);
        } else if (currentQ && line.match(/^Answer:|^Correct:/i)) {
          currentQ.answer = line.replace(/^Answer:\s?|^Correct:\s?/i, '').trim();
        } else if (currentQ && line.match(/^Explanation:/i)) {
          currentQ.explanation = line.replace(/^Explanation:\s?/i, '').trim();
        }
      }
      if (currentQ) questions.push(currentQ);
      
      questions.forEach(function(qObj, idx) {
        formatted += formatMCQQuestion(qObj.q, qObj.options, qObj.answer, qObj.explanation);
      });
      
      formatted += '</div>';
      return formatted;
    }

    function formatMCQQuestion(q, opts, ans, exp) {
      var html = '<div style="background: linear-gradient(135deg, rgba(29, 155, 240, 0.1) 0%, rgba(113, 235, 245, 0.05) 100%); border: 2px solid #1d9bf0; border-radius: 10px; padding: 16px; margin: 18px 0;">';
      html += '<p style="color: #1d9bf0; font-weight: 600; font-size: 1rem; margin-bottom: 14px;">❓ ' + parseMarkdown(q) + '</p>';
      html += '<div style="background: #0f1419; padding: 12px; border-radius: 8px; margin: 12px 0;">';
      
      opts.forEach(function(opt) {
        var letter = opt[0];
        var isCorrect = ans && ans.toUpperCase().includes(letter);
        var bgColor = isCorrect ? 'rgba(67, 122, 34, 0.2)' : 'rgba(113, 235, 245, 0.05)';
        var borderColor = isCorrect ? '#437a22' : '#2f3336';
        var textColor = isCorrect ? '#a8e6a1' : '#bab9b4';
        var icon = isCorrect ? '✓' : '○';
        var optText = opt.replace(/^[A-D]\)\s?/, '').trim();
        optText = parseMarkdown(optText);
        html += '<div style="background: ' + bgColor + '; border-left: 4px solid ' + borderColor + '; padding: 12px 14px; margin: 8px 0; border-radius: 6px; color: ' + textColor + '; display: flex; justify-content: space-between; align-items: center;"><div><span style="color: #1d9bf0; font-weight: 600; margin-right: 10px;">' + letter + ')</span><span>' + optText + '</span></div><span style="color: ' + textColor + '; font-weight: bold;">' + icon + '</span></div>';
      });
      
      html += '</div>';
      
      if (ans) {
        html += '<p style="color: #437a22; background: rgba(67, 122, 34, 0.1); padding: 10px 14px; border-radius: 6px; margin: 12px 0; border-left: 4px solid #437a22;"><strong>✓ Answer: ' + parseMarkdown(ans) + '</strong></p>';
      }
      if (exp) {
        html += '<p style="color: #71ebf5; background: rgba(113, 235, 245, 0.1); padding: 10px 14px; border-radius: 6px; margin: 10px 0; border-left: 4px solid #71ebf5;"><strong>ℹ️ ' + parseMarkdown(exp) + '</strong></p>';
      }
      
      html += '</div>';
      return html;
    }

    function formatPractice(content) {
      var formatted = '<div class="formatted-output">';
      var lines = content.split('\n');
      var problemNum = 0;
      var inSolution = false;
      var difficulty = 'Medium';
      
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        
        if (line.match(/^(Easy|Medium|Hard|Difficulty)/i)) {
          difficulty = line.split(':')[0].trim();
          formatted += '<div style="text-align: center; margin: 20px 0 16px 0;"><span style="background: linear-gradient(135deg, #1d9bf0, #1a8cd8); color: white; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;">' + difficulty + ' Level</span></div>';
        }
        else if (line.match(/^(Problem|Question|Practice)\s*\d+/i) || line.match(/^\d+\.\s+[A-Z]/)) {
          problemNum++;
          var problemText = line.replace(/^(Problem|Question|Practice)\s*\d+[:\s]?|^\d+\.\s+/, '').trim();
          problemText = parseMarkdown(problemText);
          formatted += '<div style="background: linear-gradient(135deg, rgba(29, 155, 240, 0.1) 0%, rgba(113, 235, 245, 0.05) 100%); border: 2px solid #1d9bf0; border-radius: 10px; padding: 14px; margin: 16px 0;">';
          formatted += '<p style="color: #1d9bf0; font-weight: 600; margin-bottom: 10px;">📝 Problem ' + problemNum + '</p>';
          formatted += '<p style="color: #e7e9ea; margin-bottom: 12px; line-height: 1.7;">' + problemText + '</p>';
        }
        else if (line.match(/^Solution:|^Answer:|^Step/i)) {
          if (!inSolution) {
            formatted += '<div style="background: rgba(67, 122, 34, 0.15); border: 1px solid #437a22; border-radius: 8px; padding: 12px; margin: 10px 0;">';
            formatted += '<p style="color: #a8e6a1; font-weight: 600; margin-bottom: 8px;">✓ Solution:</p>';
            inSolution = true;
          }
          var solText = line.replace(/^Solution:|^Answer:|^Step\s+\d+[:\s]?/i, '').trim();
          solText = parseMarkdown(solText);
          formatted += '<p style="color: #bab9b4; margin: 6px 0; padding-left: 12px; border-left: 2px solid #437a22;">' + solText + '</p>';
        }
        else {
          var text = parseMarkdown(line);
          formatted += '<p style="color: #bab9b4; margin: 6px 0; line-height: 1.6;">' + text + '</p>';
        }
      }
      
      if (inSolution) {
        formatted += '</div>';
      }
      formatted += '</div>';
      return formatted;
    }

    function formatFlashcards(content) {
      var formatted = '<div class="formatted-output">';
      var cards = [];
      var lines = content.split('\n');
      var currentCard = {};
      
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        
        if (line.match(/^Front:/i)) {
          if (currentCard.front && currentCard.back) {
            cards.push(currentCard);
          }
          currentCard = { front: line.replace(/^Front:\s?/i, '').trim(), back: '' };
        } else if (line.match(/^Back:/i)) {
          currentCard.back = line.replace(/^Back:\s?/i, '').trim();
        } else if (currentCard.front && !currentCard.back) {
          currentCard.front += ' ' + line;
        } else if (currentCard.front && currentCard.back) {
          currentCard.back += ' ' + line;
        }
      }
      
      if (currentCard.front && currentCard.back) {
        cards.push(currentCard);
      }
      
      formatted += '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 20px 0;">';
      for (var j = 0; j < cards.length; j++) {
        var card = cards[j];
        var frontText = parseMarkdown(card.front);
        var backText = parseMarkdown(card.back);
        
        formatted += '<div class="flashcard" style="background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%); border-radius: 12px; padding: 20px; color: #fff; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 8px 24px rgba(29, 155, 240, 0.2); font-weight: 500; line-height: 1.6; cursor: pointer; transition: transform 0.3s;">';
        formatted += '<div style="font-size: 0.8rem; color: rgba(255,255,255,0.7); margin-bottom: 8px; font-weight: 400;">Card ' + (j + 1) + ' (Front)</div>';
        formatted += '<div style="font-size: 1rem;">' + frontText + '</div></div>';
        
        formatted += '<div class="flashcard back" style="background: linear-gradient(135deg, rgba(113, 235, 245, 0.2) 0%, rgba(29, 155, 240, 0.1) 100%); border: 2px solid #71ebf5; border-radius: 12px; padding: 20px; color: #71ebf5; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-weight: 500; line-height: 1.6; cursor: pointer; transition: transform 0.3s;">';
        formatted += '<div style=\"font-size: 0.8rem; color: rgba(113, 235, 245, 0.7); margin-bottom: 8px; font-weight: 400;\">Card ' + (j + 1) + ' (Answer)</div>';
        formatted += '<div style=\"font-size: 1rem;\">' + backText + '</div></div>';
      }
      formatted += '</div></div>';
      return formatted;
    }

    function formatSummary(content) {
      var formatted = '<div class="formatted-output">';
      var lines = content.split('\n');
      var keywords = extractKeywords(content, '');
      var currentSection = '';
      
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        
        if (line.match(/Must-Know|Quick Facts|Exam Questions|Mnemonics|Key Points|Important|Key Formulas|Key Terms|Tips and Tricks/i)) {
          currentSection = line;
          var cleanLine = line.replace(/\*\*/g, '').replace(/\*\*/g, '').trim();
          formatted += '<div style="background: linear-gradient(135deg, rgba(29, 155, 240, 0.1) 0%, rgba(113, 235, 245, 0.05) 100%); border-left: 4px solid #1d9bf0; padding: 14px; margin: 16px 0; border-radius: 8px;">';
          formatted += '<h2 style="color: #1d9bf0; margin: 0 0 12px 0; font-size: 1.2rem; display: flex; align-items: center; gap: 8px;">📌 ' + parseMarkdown(cleanLine) + '</h2>';
          formatted += '<div>';
        } else if (line.match(/^[-•*]\s?[0-9]/)) {
          var itemText = line.replace(/^[-•*]\s?\d+\.\s?/, '').trim();
          itemText = parseMarkdown(itemText);
          itemText = highlightKeywords(itemText, keywords);
          formatted += '<p style="margin: 8px 0; padding-left: 16px; position: relative; line-height: 1.7; color: #bab9b4;"><span style="position: absolute; left: 0; color: #71ebf5; font-weight: bold;">▸</span>' + itemText + '</p>';
        } else if (line.match(/^[-•*]/)) {
          var itemText = line.replace(/^[-•*]\s?/, '').trim();
          itemText = parseMarkdown(itemText);
          itemText = highlightKeywords(itemText, keywords);
          formatted += '<p style="margin: 8px 0; padding-left: 16px; position: relative; line-height: 1.7; color: #bab9b4;"><span style="position: absolute; left: 0; color: #71ebf5; font-weight: bold;">▸</span>' + itemText + '</p>';
        } else if (currentSection && line.length > 0) {
          var text = parseMarkdown(line);
          text = highlightKeywords(text, keywords);
          formatted += '<p style="margin: 6px 0; color: #bab9b4; line-height: 1.6;">' + text + '</p>';
        }
      }
      
      formatted += '</div></div></div>';
      return formatted;
    }

    function formatMindmap(content) {
      var formatted = '<div class="formatted-output" style="background: #0f1419; padding: 20px; border-radius: 12px; font-family: monospace;">';
      var lines = content.split('\n');
      var tree = buildMindmapTree(lines);
      formatted += renderMindmapTree(tree);
      formatted += '</div>';
      return formatted;
    }

    function buildMindmapTree(lines) {
      var tree = { level: -1, text: 'root', children: [], id: 'root' };
      var stack = [tree];
      var nodeId = 0;
      
      lines.forEach(function(line) {
        var indent = line.search(/\S/);
        if (indent === -1) return;
        var text = line.trim();
        if (!text) return;
        
        var level = Math.floor(indent / 2);
        var node = { level: level, text: text.replace(/^[-•*]\s?/, '').trim(), children: [], id: 'node' + (nodeId++) };
        
        while (stack.length > 1 && stack[stack.length - 1].level >= level) {
          stack.pop();
        }
        
        stack[stack.length - 1].children.push(node);
        stack.push(node);
      });
      
      return tree;
    }

    function renderMindmapTree(node, isRoot) {
      if (isRoot === undefined) isRoot = true;
      var colors = ['#1d9bf0', '#71ebf5', '#a8e6a1', '#ff9ab3', '#ffc857', '#ff6b9d'];
      var color = colors[node.level + 1] || colors[colors.length - 1];
      
      if (isRoot && node.level === -1) {
        var html = '<div>';
        node.children.forEach(function(child) {
          html += renderMindmapTree(child, false);
        });
        html += '</div>';
        return html;
      }
      
      var hasChildren = node.children && node.children.length > 0;
      var text = parseMarkdown(node.text);
      var size = [1.3, 1.1, 0.95, 0.85, 0.75][Math.min(node.level + 1, 4)];
      var weight = node.level === 0 ? 700 : node.level === 1 ? 600 : node.level === 2 ? 500 : 400;
      
      var html = '<div style="margin: 8px 0; margin-left: ' + ((node.level + 1) * 24) + 'px;">';
      
      if (hasChildren) {
        html += '<div style="cursor: pointer; padding: 8px 12px; background: linear-gradient(135deg, rgba(' + hexToRgba(color) + ', 0.2) 0%, rgba(' + hexToRgba(color) + ', 0.05) 100%); border-left: 4px solid ' + color + '; border-radius: 6px; margin: 4px 0; font-size: ' + size + 'rem; font-weight: ' + weight + '; color: ' + color + '; display: flex; align-items: center; gap: 8px;" onclick="toggleMindmapBranch(this)">';
        html += '<span style=\"display: inline-block; min-width: 20px; text-align: center; transition: transform 0.3s;\">▶</span>';
        html += '<span>' + text + '</span></div>';
        html += '<div style=\"display: none;\" class=\"mindmap-branch\">';
        node.children.forEach(function(child) {
          html += renderMindmapTree(child, false);
        });
        html += '</div>';
      } else {
        html += '<div style=\"padding: 8px 12px; background: rgba(' + hexToRgba(color) + ', 0.1); border-left: 3px solid ' + color + '; border-radius: 6px; margin: 4px 0; font-size: ' + size + 'rem; font-weight: ' + weight + '; color: ' + color + ';\">' + text + '</div>';
      }
      
      html += '</div>';
      return html;
    }

    function hexToRgba(hex) {
      var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? parseInt(result[1], 16) + ',' + parseInt(result[2], 16) + ',' + parseInt(result[3], 16) : '29,155,240';
    }

    window.toggleMindmapBranch = function(element) {
      var branch = element.nextElementSibling;
      var arrow = element.querySelector('span:first-child');
      if (branch && branch.classList.contains('mindmap-branch')) {
        if (branch.style.display === 'none') {
          branch.style.display = 'block';
          arrow.style.transform = 'rotate(90deg)';
        } else {
          branch.style.display = 'none';
          arrow.style.transform = 'rotate(0deg)';
        }
      }
    };

    function formatContent(type, content) {
      switch(type) {
        case 'notes': return formatNotes(content);
        case 'mcq': return formatMCQ(content);
        case 'practice': return formatPractice(content);
        case 'flashcards': return formatFlashcards(content);
        case 'summary': return formatSummary(content);
        case 'mindmap': return formatMindmap(content);
        default: return '<div class="formatted-output"><p>' + parseMarkdown(content) + '</p></div>';
      }
    }

    async function generate() {
      var topic = document.getElementById('topic').value.trim();
      if (!topic) {
        alert('Please enter a topic');
        return;
      }
      var key = document.getElementById('apiKey').value.trim();
      if (!key) {
        alert('Please paste your API key');
        return;
      }
      var provider = document.getElementById('apiProvider').value;
      var subject = document.getElementById('subject').value;
      var grade = document.getElementById('grade').value;
      document.getElementById('loader').style.display = 'flex';
      try {
        var prompt = getPrompt(contentType, topic, subject, grade);
        var result = await callAPI(provider, key, prompt);
        historyData.push({
          topic: topic,
          type: contentType,
          content: result
        });
        currentHistIdx = historyData.length - 1;
        showResult(result, contentType);
        renderHistory();
        showToast('✨ Material generated successfully!');
      } catch (e) {
        alert('Error: ' + e.message);
      } finally {
        document.getElementById('loader').style.display = 'none';
      }
    }

    function showResult(content, type) {
      var resultCard = document.getElementById('resultCard');
      var outputDiv = document.getElementById('outputContent');
      
      // Store raw content
      outputDiv.style.display = 'none';
      outputDiv.textContent = content;
      
      // Show formatted content
      if (!resultCard.querySelector('.formatted-output')) {
        var formattedDiv = document.createElement('div');
        formattedDiv.id = 'formattedOutput';
        resultCard.appendChild(formattedDiv);
      }
      
      document.getElementById('formattedOutput').innerHTML = formatContent(type, content);
      resultCard.style.display = 'block';
      renderHistTabs();
    }

    function renderHistTabs() {
      var tabs = document.getElementById('histTabs');
      tabs.innerHTML = '';
      for (var i = 0; i < historyData.length; i++) {
        var h = historyData[i];
        var t = document.createElement('div');
        t.className = 'hist-tab' + (i === currentHistIdx ? ' active' : '');
        t.textContent = h.topic + ' (' + h.type + ')';
        t.onclick = (function(idx) {
          return function() {
            currentHistIdx = idx;
            showResult(historyData[idx].content, historyData[idx].type);
          };
        })(i);
        tabs.appendChild(t);
      }
    }

    function renderHistory() {
      var list = document.getElementById('historyList');
      list.innerHTML = '';
      for (var i = historyData.length - 1; i >= 0; i--) {
        var h = historyData[i];
        var item = document.createElement('div');
        item.className = 'hist-item';
        item.innerHTML = '<span>📚 ' + h.topic + ' - <strong>' + h.type + '</strong></span><span class="del-btn" onclick="delHistory(' + i + ', event)">×</span>';
        item.onclick = function(idx) {
          return function(e) {
            if (e.target.classList.contains('del-btn')) return;
            currentHistIdx = idx;
            showResult(historyData[idx].content, historyData[idx].type);
            document.getElementById('resultCard').style.display = 'block';
            renderHistTabs();
          };
        }(i);
        list.appendChild(item);
      }
    }

    function delHistory(idx, event) {
      event.stopPropagation();
      historyData.splice(idx, 1);
      if (currentHistIdx >= historyData.length) currentHistIdx = historyData.length - 1;
      if (historyData.length === 0) {
        document.getElementById('historyCard').style.display = 'none';
        document.getElementById('resultCard').style.display = 'none';
      } else {
        showResult(historyData[currentHistIdx].content, historyData[currentHistIdx].type);
      }
      renderHistory();
      renderHistTabs();
    }

    function copyOutput() {
      var text = document.getElementById('outputContent').textContent;
      navigator.clipboard.writeText(text).then(function() {
        showToast('✓ Copied to clipboard!');
      }).catch(function() {
        alert('Failed to copy');
      });
    }

    function downloadOutput() {
      var text = document.getElementById('outputContent').textContent;
      var blob = new Blob([text], {
        type: 'text/plain'
      });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'studyforge-' + contentType + '-' + new Date().toISOString().slice(0, 10) + '.txt';
      a.click();
      URL.revokeObjectURL(url);
      showToast('⬇️ Downloaded successfully!');
    }
  </script>
</body>
</html>
