<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyForAll - AI Study Material Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
      color: #e7e9ea;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(29, 155, 240, 0.2);
    }

    .header h1 {
      font-size: 3rem;
      color: #fff;
      margin-bottom: 8px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .header p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.1rem;
    }

    .card {
      background: linear-gradient(135deg, #16181c 0%, #1a1f2e 100%);
      border: 1px solid #2f3336;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .card:hover {
      border-color: #1d9bf0;
      box-shadow: 0 8px 24px rgba(29, 155, 240, 0.15);
    }

    .api-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .api-select,
    .dropdown,
    .topic-input,
    .api-key-input {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #2f3336;
      background: #0f1419;
      color: #fff;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .api-select:focus,
    .dropdown:focus,
    .topic-input:focus,
    .api-key-input:focus {
      outline: none;
      border-color: #1d9bf0;
      box-shadow: 0 0 0 3px rgba(29, 155, 240, 0.1);
      background: #16181c;
    }

    .api-key-input {
      flex: 1;
      min-width: 200px;
    }

    .api-select {
      min-width: 160px;
      cursor: pointer;
    }

    .dropdown {
      flex: 1;
      min-width: 140px;
      cursor: pointer;
    }

    .topic-input {
      width: 100%;
      margin-bottom: 12px;
    }

    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .get-key-link {
      color: #fff;
      background: rgba(29, 155, 240, 0.2);
      border: 1px solid #1d9bf0;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      white-space: nowrap;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .get-key-link:hover {
      background: #1d9bf0;
      color: #fff;
      box-shadow: 0 4px 12px rgba(29, 155, 240, 0.3);
    }

    .type-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }

    .type-btn {
      padding: 12px 20px;
      border-radius: 24px;
      border: 2px solid #2f3336;
      background: #0f1419;
      color: #71767b;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .type-btn:hover {
      border-color: #1d9bf0;
      color: #1d9bf0;
      background: rgba(29, 155, 240, 0.05);
    }

    .type-btn.active {
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      color: #fff;
      border-color: #1d9bf0;
      box-shadow: 0 4px 12px rgba(29, 155, 240, 0.3);
    }

    .generate-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(29, 155, 240, 0.2);
    }

    .generate-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(29, 155, 240, 0.4);
    }

    .generate-btn:disabled {
      background: #2f3336;
      color: #71767b;
      cursor: not-allowed;
      box-shadow: none;
    }

    .hist-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .hist-tab {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #2f3336;
      background: #0f1419;
      color: #71767b;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.3s ease;
    }

    .hist-tab:hover {
      border-color: #1d9bf0;
      color: #1d9bf0;
      background: rgba(29, 155, 240, 0.05);
    }

    .hist-tab.active {
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      color: #fff;
      border-color: #1d9bf0;
      box-shadow: 0 4px 12px rgba(29, 155, 240, 0.2);
    }

    .out-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .action-btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid #1d9bf0;
      background: rgba(29, 155, 240, 0.1);
      color: #1d9bf0;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .action-btn:hover {
      background: #1d9bf0;
      color: #fff;
      box-shadow: 0 4px 12px rgba(29, 155, 240, 0.3);
    }

    .output-content {
      background: #0f1419;
      border: 1px solid #2f3336;
      border-radius: 12px;
      padding: 20px;
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      line-height: 1.8;
      color: #e7e9ea;
      max-height: 500px;
      overflow-y: auto;
      word-wrap: break-word;
    }

    /* Enhanced output formatting */
    .formatted-output {
      background: #0f1419;
      border: 1px solid #2f3336;
      border-radius: 12px;
      padding: 24px;
      max-height: 700px;
      overflow-y: auto;
    }

    .formatted-output h2 {
      color: #1d9bf0;
      font-size: 1.4rem;
      margin: 20px 0 16px 0;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(29, 155, 240, 0.3);
    }

    .formatted-output h3 {
      color: #71ebf5;
      font-size: 1.1rem;
      margin: 16px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .formatted-output h4 {
      color: #e7e9ea;
      font-size: 0.95rem;
      margin: 12px 0 8px 0;
      font-weight: 600;
    }

    .formatted-output p {
      margin: 8px 0;
      line-height: 1.7;
      color: #bab9b4;
    }

    .formatted-output li {
      margin: 6px 0 6px 20px;
      color: #bab9b4;
      line-height: 1.6;
    }

    .formatted-output ul, .formatted-output ol {
      margin: 10px 0;
    }

    /* ── Markdown body ── */
    .md-body h2.md-h, .md-body h3.md-h, .md-body h4.md-h,
    .md-body h5.md-h, .md-body h6.md-h {
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.35;
    }

    .md-body h2.md-h {
      color: #1d9bf0;
      font-size: 1.35rem;
      margin: 26px 0 14px 0;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(29, 155, 240, 0.3);
    }

    .md-body h3.md-h {
      color: #71ebf5;
      font-size: 1.12rem;
      margin: 22px 0 10px 0;
    }

    .md-body h4.md-h {
      color: #e7e9ea;
      font-size: 1rem;
      margin: 18px 0 8px 0;
      font-weight: 600;
    }

    .md-body h5.md-h, .md-body h6.md-h {
      color: #bab9b4;
      font-size: 0.92rem;
      margin: 14px 0 6px 0;
      font-weight: 600;
    }

    .md-body > :first-child { margin-top: 0; }

    .md-secnum {
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(29, 155, 240, 0.2);
      color: #1d9bf0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .md-body p {
      margin: 10px 0;
      line-height: 1.75;
      color: #bab9b4;
    }

    .md-body strong { color: #e7e9ea; font-weight: 700; }
    .md-body em { color: #d3d3cf; font-style: italic; }
    .md-body del { color: #71767b; }

    .md-link { color: #1d9bf0; text-decoration: underline; }
    .md-link:hover { color: #71ebf5; }

    .md-list {
      margin: 10px 0 10px 22px;
      padding-left: 8px;
    }

    .md-list li {
      margin: 7px 0;
      line-height: 1.7;
      color: #bab9b4;
    }

    ul.md-list { list-style: none; }
    ul.md-list > li { position: relative; padding-left: 18px; }
    ul.md-list > li::before {
      content: '▸';
      position: absolute;
      left: 0;
      color: #1d9bf0;
    }

    ol.md-list { list-style: decimal; }
    ol.md-list > li::marker { color: #1d9bf0; font-weight: 600; }

    .md-list .md-list { margin-left: 14px; }

    .md-def {
      margin: 12px 0;
      padding: 10px 14px;
      background: rgba(113, 235, 245, 0.06);
      border-left: 3px solid #71ebf5;
      border-radius: 0 6px 6px 0;
      color: #bab9b4;
    }

    .md-def-term { color: #71ebf5; font-weight: 600; }

    .md-quote {
      margin: 14px 0;
      padding: 10px 16px;
      background: rgba(29, 155, 240, 0.05);
      border-left: 4px solid #1d9bf0;
      border-radius: 0 6px 6px 0;
      color: #bab9b4;
      font-style: italic;
    }

    .md-hr {
      border: none;
      border-top: 1px solid #2f3336;
      margin: 22px 0;
    }

    .md-warn {
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.08);
      border-left: 3px solid #fbbf24;
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
      margin: 10px 0;
      font-size: 0.88rem;
    }

    /* ── Tables ── */
    .md-table-wrap {
      overflow-x: auto;
      margin: 18px 0;
      border: 1px solid #2f3336;
      border-radius: 10px;
    }

    .md-table {
      border-collapse: collapse;
      width: 100%;
      min-width: 380px;
      font-size: 0.9rem;
    }

    .md-table th {
      background: rgba(29, 155, 240, 0.15);
      color: #71ebf5;
      font-weight: 600;
      padding: 11px 14px;
      border-bottom: 2px solid rgba(29, 155, 240, 0.35);
      white-space: nowrap;
    }

    .md-table td {
      padding: 10px 14px;
      color: #e7e9ea;
      border-top: 1px solid #2f3336;
      line-height: 1.6;
    }

    .md-table tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
    .md-table tbody tr:hover { background: rgba(29, 155, 240, 0.06); }

    /* ── Code ── */
    .md-code {
      background: rgba(29, 155, 240, 0.16);
      color: #71ebf5;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.88em;
      font-family: 'Consolas', 'Monaco', monospace;
    }

    .md-pre {
      position: relative;
      background: #16181c;
      border: 1px solid #2f3336;
      border-radius: 10px;
      padding: 16px;
      margin: 16px 0;
      overflow-x: auto;
    }

    .md-pre code {
      color: #e7e9ea;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.86rem;
      line-height: 1.6;
      white-space: pre;
    }

    .md-lang {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 0.7rem;
      color: #71767b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── Question cards ── */
    .q-card {
      background: linear-gradient(135deg, rgba(29, 155, 240, 0.06) 0%, rgba(113, 235, 245, 0.03) 100%);
      border: 2px solid #2f3336;
      border-radius: 10px;
      padding: 16px;
      margin: 14px 0;
    }

    .q-title {
      color: #1d9bf0 !important;
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 12px !important;
    }

    .q-body p:first-child { margin-top: 0; }

    .mcq-letter { color: #1d9bf0; font-weight: 600; margin-right: 10px; }
    .mcq-icon { font-weight: bold; font-size: 1.1rem; }
    .mcq-inert { cursor: default; opacity: 0.85; }

    .mcq-explain {
      padding: 10px 14px;
      border-radius: 6px;
      margin: 10px 0;
      background: rgba(113, 235, 245, 0.08);
      border-left: 4px solid #71ebf5;
      color: #71ebf5;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .reveal-btn {
      background: rgba(29, 155, 240, 0.15);
      border: 1px solid #1d9bf0;
      color: #1d9bf0;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .reveal-btn:hover { background: rgba(29, 155, 240, 0.28); }

    .reveal-btn.revealed {
      background: rgba(34, 197, 94, 0.15);
      border-color: #22c55e;
      color: #22c55e;
    }

    .sol-box {
      background: rgba(34, 197, 94, 0.07);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 8px;
      padding: 14px;
      margin-top: 10px;
    }

    .sol-title {
      color: #22c55e !important;
      font-weight: 600;
      margin: 0 0 8px 0 !important;
    }

    /* ── Flashcards (click to flip) ── */
    .flip-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
      margin: 18px 0;
    }

    .flip-card {
      perspective: 1200px;
      height: 190px;
      cursor: pointer;
    }

    .flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.55s;
      transform-style: preserve-3d;
    }

    .flip-card.flipped .flip-inner { transform: rotateY(180deg); }

    .flip-face {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .flip-front {
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      color: #fff;
      box-shadow: 0 8px 24px rgba(29, 155, 240, 0.2);
    }

    .flip-back {
      background: linear-gradient(135deg, rgba(113, 235, 245, 0.18) 0%, rgba(29, 155, 240, 0.1) 100%);
      border: 2px solid #71ebf5;
      color: #71ebf5;
      transform: rotateY(180deg);
    }

    /* The default cyan code chip is unreadable on the blue card front. */
    .flip-front code.md-code {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }

    .flip-front strong, .flip-front em { color: #fff; }

    .flip-tag {
      font-size: 0.72rem;
      opacity: 0.75;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .flip-text {
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.5;
      overflow-y: auto;
      max-height: 110px;
    }

    .flip-hint {
      font-size: 0.68rem;
      opacity: 0.6;
      margin-top: 10px;
    }

    /* ── Mind map ── */
    .mindmap-body {
      background: #0f1419;
      border: 1px solid #2f3336;
      border-radius: 12px;
      padding: 20px;
      max-height: 700px;
      overflow: auto;
    }

    .mm-node {
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      margin: 4px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mm-arrow {
      display: inline-block;
      min-width: 18px;
      text-align: center;
      transition: transform 0.3s;
    }

    .mm-leaf {
      padding: 8px 12px;
      border-radius: 6px;
      margin: 4px 0;
    }

    @media (max-width: 600px) {
      .flip-grid { grid-template-columns: 1fr; }
      .md-table { font-size: 0.82rem; }
      .md-table th, .md-table td { padding: 8px 10px; }
    }

    .question-block {
      background: linear-gradient(135deg, rgba(29, 155, 240, 0.1) 0%, rgba(26, 140, 216, 0.05) 100%);
      border-left: 4px solid #1d9bf0;
      padding: 16px;
      margin: 12px 0;
      border-radius: 8px;
    }

    .question-block strong {
      color: #71ebf5;
    }

    .answer-block {
      background: rgba(67, 122, 34, 0.1);
      border-left: 4px solid #437a22;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      color: #bab9b4;
      font-size: 0.9rem;
    }

    .concept-box {
      background: linear-gradient(135deg, rgba(113, 235, 245, 0.1) 0%, rgba(29, 155, 240, 0.05) 100%);
      border: 1px solid rgba(113, 235, 245, 0.3);
      padding: 14px;
      margin: 10px 0;
      border-radius: 8px;
      border-left: 4px solid #71ebf5;
    }

    .formula-box {
      background: rgba(249, 24, 128, 0.08);
      border: 1px solid rgba(249, 24, 128, 0.2);
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      color: #ff9ab3;
      text-align: center;
    }

    .flashcard {
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      border-radius: 12px;
      padding: 20px;
      margin: 12px 0;
      color: #fff;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 4px 16px rgba(29, 155, 240, 0.2);
    }

    .flashcard.back {
      background: linear-gradient(135deg, rgba(113, 235, 245, 0.2) 0%, rgba(29, 155, 240, 0.1) 100%);
      color: #71ebf5;
      border: 1px solid #71ebf5;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 0 12px 0;
      padding-bottom: 8px;
      border-bottom: 2px solid rgba(29, 155, 240, 0.3);
    }

    .section-icon {
      font-size: 1.3rem;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 250px;
      overflow-y: auto;
    }

    .hist-item {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #2f3336;
      background: linear-gradient(135deg, #16181c 0%, #1a1f2e 100%);
      color: #e7e9ea;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }

    .hist-item:hover {
      border-color: #1d9bf0;
      background: linear-gradient(135deg, rgba(29, 155, 240, 0.1) 0%, rgba(29, 155, 240, 0.05) 100%);
      transform: translateX(4px);
    }

    .hist-item .del-btn {
      color: #f91880;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      transition: all 0.3s ease;
    }

    .hist-item .del-btn:hover {
      color: #ff4d4d;
      transform: scale(1.2);
    }

    .history-tabs {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .tab-label {
      color: #71767b;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .loader {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 20, 25, 0.95);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #2f3336;
      border-top-color: #1d9bf0;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 20px rgba(29, 155, 240, 0.3);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader p {
      margin-top: 20px;
      color: #71767b;
      font-size: 1.1rem;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      color: #fff;
      padding: 14px 28px;
      border-radius: 10px;
      opacity: 0;
      transition: opacity 0.3s;
      font-size: 0.9rem;

<body>
  <div class="header">

  <div class="card api-card">

  <div class="card form-card">

        <option value="Science">Science</option>

        <option value="UG">Undergraduate</option>
      </select>

  <div class="card types-card">
    <h3>Content Type</h3>
    <div class="type-btns">
      <button class="type-btn active" data-type="notes" onclick="setType('notes')">Study Notes</button>
      <button class="type-btn" data-type="mcq" onclick="setType('mcq')">MCQs</button>
      <button class="type-btn" data-type="practice" onclick="setType('practice')">Practice</button>
      <button class="type-btn" data-type="flashcards" onclick="setType('flashcards')">Flashcards</button>
